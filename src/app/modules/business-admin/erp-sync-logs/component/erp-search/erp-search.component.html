<div class="w-12">
  <div class="modal-body p-4">
    <div class="col-lg-12 mb-2 px-0">
      <div class="d-flex align-items-center flex-wrap gap-3 bg-light-2 border border-dashed rounded-3 px-3">
        <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 pt-3 pb-0 pb-lg-3">
          <input type="search" class="form-control w-sm-auto py-2" placeholder="Search by UUID"
            [(ngModel)]="searchParams.query">
          <div>
            <p-dropdown appendTo="body" name="logicalSystem" [options]="logicalSytemList" optionLabel="systemId"
              optionValue="systemId" [(ngModel)]="searchParams.logicalSystem"
              placeholder="Select Logical System"></p-dropdown>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2 ms-2">
          <div>
            <button matRipple class="btn btn-info shadow" [disabled]="isLoading || !searchParams.logicalSystem" (click)="search()">
              <ng-container *ngIf="isLoading">
                <span clas="indicator-progress" [style.display]="'block'">
                  Searching...{{ " " }}
                  <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                </span>
              </ng-container>
              <span *ngIf="!isLoading">Search</span>
            </button>
          </div>
          <div>
            <button class="btn btn-light text-info-dark fw-semibold shadow bg-white me-3" matRipple
              [disabled]="resettingLoader" (click)="reset()">
              <ng-container *ngIf="resettingLoader">
                <span clas="indicator-progress" [style.display]="'block'">
                  Resetting...{{ " " }}
                  <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                </span>
              </ng-container>
              <span *ngIf="!resettingLoader">Reset</span>
            </button>
          </div>
        </div>
      </div>
      <div class="table-responsive mt-4 px-0" *ngIf="erpSyncLogs?.length && !initialLoader">
        <table class="table user-management" mat-table matSort (matSortChange)="sortChange($event)"
          [dataSource]="erpSyncLogs" matSortDirection="desc" matSortActive="lastUpdated">
          <ng-container matColumnDef="uuid">
            <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>UUID </th>
            <td mat-cell *matCellDef="let element">
              <p class="text-grey-4 my-0 text-truncate table-title">{{element.uuid}}</p>
            </td>
          </ng-container>

          <ng-container matColumnDef="lastUpdated">
            <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>Date/Time</th>
            <td mat-cell *matCellDef="let element">
              <span class="fw-semibold text-truncate">{{element.lastUpdated | date:'MM-dd-yyyy HH:mm a'}}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let element">
              <div class="d-flex gap-3">
                  <a (click)="downloadXML(element)">
                    <img src="./assets/images/download.svg" alt="" class="cursor-pointer" matTooltip="Download" />
                  </a>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
      <div *ngIf="erpSyncLogs.length && !initialLoader">
        <mat-paginator (page)="onPageChange($event)" [length]='totalElements' [pageIndex]="pageInd"
          [pageSize]="queryParams.limit" [pageSizeOptions]="[5, 10, 20, 50, 100]" aria-label="Select page">
        </mat-paginator>
      </div>
      <div class="center d-flex flex-column align-items-center mt-5"
        *ngIf="!erpSyncLogs.length && !initialLoader">
        No records found !
      </div>
      <div class="center h-100 mt-5" *ngIf="initialLoader">
        <app-page-loader class="v-center"></app-page-loader>
      </div>
    </div>

  </div>
  <div class="modal-footer">

    <div class="d-flex flex-grow-1 justify-content-end">
      <div class="d-flex">
        <button class="cancel-btn me-3" (click)="close()">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
