<!-- Add New Role (offcanvas)-->
<div class="pb-5" style="height: calc(100% - 50px);">
    <div class="d-flex pt-0 pe-0 border-bottom align-items-start justify-content-between">
      <div class="text-grey-3 fw-medium d-flex align-items-center gap-2 py-3 ps-3">
        <div class="icon-box icon-box-primary rounded-3 p-2 p-xxl-2 position-relative">
          <img src="./assets/images/role-details.png" alt="role">
        </div> Conditional Mapping Details
      </div>
      <button type="button" class="btn btn-cls" mat-dialog-close aria-label="Close"><img src="./assets/images/x.svg"
          alt=""></button>
    </div>
    <div class="px-4 py-3" style="height: calc(100% - 25px);overflow-y: auto;">
      <!-- form -->
      <form #mappingF="ngForm">
        <div class="row g-3 w-100">
          
          <div class="d-flex justify-content-between">
          <div class="col-md-5">
            <label for="erpCode" class="form-label">ERP Code</label>
            <input type="text" class="form-control" name="erpCode" [(ngModel)]="mapping.erpCode" required />
          </div>
          <div class="col-md-6">
            <label for="taxCode" class="form-label">Tax Code</label>
            <input type="text" class="form-control" name="taxCode" [(ngModel)]="mapping.taxCode" required/>
          </div>
          </div>
          <div class="col-md-12">
            <label for="description" class="form-label">Description</label>
            <input type="text" class="form-control" name="description" [(ngModel)]="mapping.description" />
          </div>
          <div class="col-md-12">
            <label for="erpDescription" class="form-label">ERP Description</label>
            <input type="text" class="form-control" name="erpDescription" [(ngModel)]="mapping.erpDescription" />
          </div>
          <div class="col-md-12">
            <label for="generalLedger" class="form-label">General Ledger</label>
            <input type="text" class="form-control" name="generalLedger" [(ngModel)]="mapping.generalLedger" required/>
          </div>
          
          <div class="col-md-12">
            <label for="Select Role" class="form-label">System</label>
            <p-dropdown appendTo="body" name="logicalSystem" [options]="logicalSytemList" optionLabel="systemId"
                    optionValue="systemId" [(ngModel)]="mapping.logicalSystem"
                    placeholder="Select Logical System"></p-dropdown>
          </div>
        </div>
      </form>
      <!-- form -->
    </div>
    <div class="offcanvas-footer position-absolute bottom-0 bg-light px-3 py-2 w-100">
      <div>
        <div class="d-flex align-items-center gap-1" style="float: right;">
          <button type="button" class="btn btn-light px-3 me-2" mat-dialog-close>Cancel</button>
          <button type="button" class="btn btn-info px-5" [disabled]="mappingF.invalid" mat-dialog-close
            (click)="saveMapping()">Save</button>
        </div>
      </div>
    </div>
  </div>
  <!-- /Add New Role (offcanvas)-->
