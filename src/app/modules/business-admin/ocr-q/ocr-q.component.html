      <div class="main-content bg-white w-100">
        <div class="row mx-0 pb-0 px-lg-4 pt-lg-3">
          <h5 style="cursor: pointer" routerLink="/system-admin/system-logs" class="fw-semibold">
            <img src="./assets/images/arrow-left.svg" class="me-1" alt="arrow left" />
            Thick-Client Logs
          </h5>
          <div class="col-lg-12 px-0 mb-1 mt-2">
            <form action=""
              class="d-flex align-items-center justify-content-between flex-wrap gap-3 bg-light-2 border border-dashed rounded-3 px-3">
              <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 pt-3 pb-0 pb-lg-3">
                <div class="position-relative search-form">
                  <img src="./assets/images/search.svg" class="ms-2 position-absolute" alt="search icon" />
                  <input [(ngModel)]="searchForm.docId" name="docId" type="search" class="form-control w-sm-auto py-2"
                    placeholder="Search by Doc ID" />
                </div>
                <div class="dropdown-border">
                  <p-dropdown [(ngModel)]="searchForm.region" name="region" [options]="regionListDropDown"
                    placeholder="Select Region" optionDisabled="inactive" optionLabel="name"
                    optionValue="name"></p-dropdown>
                </div>
                <div class="dropdown-border">
                  <p-dropdown [(ngModel)]="searchForm.status" name="status" [options]="statusList"
                    placeholder="Select Status" optionDisabled="inactive" optionLabel="name"
                    optionValue="value"></p-dropdown>
                </div>
                <div class="d-flex align-items-center gap-2 ms-2">
                  <div>
                    <button matRipple class="btn btn-info shadow" [disabled]="isLoading" (click)="search()">
                      <ng-container *ngIf="isLoading">
                        <span clas="indicator-progress" [style.display]="'block'">
                          Searching...{{ " " }}
                          <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                        </span>
                      </ng-container>
                      <span *ngIf="!isLoading">Search</span>
                    </button>
                  </div>
                  <div>
                    <button class="btn btn-light text-info-dark fw-semibold shadow bg-white me-3" matRipple
                      [disabled]="resettingLoader" (click)="reset()">
                      <ng-container *ngIf="resettingLoader">
                        <span clas="indicator-progress" [style.display]="'block'">
                          Resetting...{{ " " }}
                          <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                        </span>
                      </ng-container>
                      <span *ngIf="!resettingLoader">Reset</span>
                    </button>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div class="col-lg-12 px-0">
            <div class="table-responsive mt-4 px-0" *ngIf="ocrQLogs?.length && !initialLoader">
              <table (matSortChange)="sortChange($event)" matSort matSortDirection="desc"
                matSortActive="createdDateTime" class="mb-0 table user-management" mat-table [dataSource]="ocrQLogs">
                <ng-container matColumnDef="docId">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                    Doc ID
                  </th>
                  <td mat-cell *matCellDef="let element">
                    <p class="text-info fw-semibold my-0">
                      {{ element.docId }}
                    </p>
                  </td>
                </ng-container>
                <ng-container matColumnDef="createdDateTime">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                    Created Date&Time
                  </th>
                  <td mat-cell *matCellDef="let element">
                    <p class="text-grey-4 my-0 text-truncate table-title">
                      {{ element.createdDateTime | date : "medium" }}
                    </p>
                  </td>
                </ng-container>
                <ng-container matColumnDef="processMode">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                    Process Mode
                  </th>
                  <td mat-cell *matCellDef="let element">
                    <p class="text-grey-4 my-0 text-truncate table-title">
                      {{ element.processMode }}
                    </p>
                  </td>
                </ng-container>
                <ng-container matColumnDef="type">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                    Type
                  </th>
                  <td mat-cell *matCellDef="let element">
                    <span class="fw-semibold">{{ element.type }}</span>
                  </td>
                </ng-container>
                <ng-container matColumnDef="region">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                    Region
                  </th>
                  <td mat-cell *matCellDef="let element">
                    <span>{{ element.region }}</span>
                  </td>
                </ng-container>
                <ng-container matColumnDef="logicalSystem">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                    Logical System
                  </th>
                  <td mat-cell *matCellDef="let element">
                    <span>{{ element.logicalSystem }}</span>
                  </td>
                </ng-container>
                <ng-container matColumnDef="status">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                    Status
                  </th>
                  <td mat-cell *matCellDef="let element">
                    <span>{{ element.status }}</span>
                  </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
              </table>
              <div *ngIf="!initialLoader">
                <mat-paginator showFirstLastButtons [length]="total" [pageSize]="size" (page)="onPaginateChange($event)"
                  [pageIndex]="page - 1" [pageSizeOptions]="limits" (page)="pageEvent = $event">
                </mat-paginator>
              </div>
            </div>
            <div class="center d-flex flex-column align-items-center mt-5" *ngIf="!ocrQLogs?.length && !initialLoader">
              <!-- <img src="./assets/media/icons/not-found.svg" alt="" /> -->
              No records found !
            </div>
            <div class="center h-100 mt-5" *ngIf="initialLoader">
              <app-page-loader class="v-center"></app-page-loader>
            </div>
          </div>
        </div>
      </div>

  </div>
</div> -->
