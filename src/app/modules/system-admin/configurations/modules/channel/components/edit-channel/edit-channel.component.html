<!-- Add New Role (offcanvas)-->
<div class="pb-5" style="height: calc(100% - 50px);">
  <div class="d-flex pt-0 pe-0 border-bottom align-items-start justify-content-between">
    <div class="text-grey-3 fw-medium d-flex align-items-center gap-2 py-3 ps-3">
      Update
      <span *ngIf="channelsObject.type === 'email'">
        Email
      </span>
      <span *ngIf="channelsObject.type === 'thickClient'">
        ThickClient
      </span>
      <span *ngIf="channelsObject.type === 'ftp'">
        FTP
      </span>
    </div>
    <button type="button" class="btn btn-cls" (click)="onClose()"><img src="./assets/images/x.svg" alt=""></button>
  </div>
  <ul class="nav nav-tab">
    <li class="nav-item">
      <a class="nav-link" [ngClass]="{activeTab:selectedTab ===1}" (click)="onTabchange(1)">
        <span>
          General
        </span>
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" [ngClass]="{activeTab:selectedTab ===2}" (click)="onTabchange(2)">
        <span>
          Channel Config
        </span>
      </a>
    </li>
  </ul>
  <div class="px-4 py-3" style="height: calc(100% - 25px);overflow-y: auto;">
    <!-- form -->
    <form #form="ngForm">
      <div *ngIf="selectedTab === 1">
        <div class="d-flex align-items-center gap-5 flex-wrap">
          <div class="form-check d-flex align-items-center gap-2">
            <input [(ngModel)]="channelsObject.enabled" class="form-check-input cursor-pointer mb-1" type="checkbox"
              name="enabled" id="enabled" />
            <label class="form-check-label mb-0 cursor-pointer" for="enabled">
              Enable
            </label>
          </div>
          <div class="form-check d-flex align-items-center gap-2">
            <input [(ngModel)]="channelsObject.configurableXInvoiceMappingEnabled"
              class="form-check-input cursor-pointer mb-1" type="checkbox"
              name="configurableXInvoiceMappingEnabled" id="configurableXInvoiceMappingEnabled" />
            <label class="form-check-label mb-0 cursor-pointer" for="configurableXInvoiceMappingEnabled">
              Configurable X-Invoice Mapping
            </label>
          </div>
          <div class="form-check d-flex align-items-center gap-2">
            <input [(ngModel)]="channelsObject.xInvoiceFallbackToHardCoded"
              class="form-check-input cursor-pointer mb-1" type="checkbox"
              name="xInvoiceFallbackToHardCoded" id="xInvoiceFallbackToHardCoded"
              [disabled]="!channelsObject.configurableXInvoiceMappingEnabled" />
            <label class="form-check-label mb-0 cursor-pointer" for="xInvoiceFallbackToHardCoded">
              X-Invoice Fallback to Hard-Coded
            </label>
          </div>
        </div>

        <!-- <div class="row">
        <div class="col-md-6">
          <div class=" mt-4">
            <label class="mb-1" for="">System</label>
            <select class="form-select  py-2" aria-label="Default select example">
              <option disabled selected value="">All System</option>

            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div class="mt-4">

            <label for="" class="mb-1">Company</label>
            <select class="form-select  py-2" aria-label="Default select example">
              <option disabled selected value="">All Company</option>

            </select>
          </div>
        </div>
      </div> -->
        <div>
          <div class="mt-3">
            <label class="mb-1" for="">Mode</label>
            <div class="dropdown-border w-100">
              <p-dropdown name="mode" [(ngModel)]="channelsObject.mode" [options]="modeTypes" placeholder="Select Mode"
                optionDisabled="inactive" [required]="true"></p-dropdown>
            </div>
          </div>
          <div class="mt-3">
            <label class="mb-1" for="">Process Types</label>
            <div class="dropdown-border w-100">
              <p-dropdown name="processorType" [(ngModel)]="channelsObject.processorType"
                (onChange)="selectedType($event)" [options]="processTypes" placeholder="Select Process Types"
                optionDisabled="inactive" [required]="true"></p-dropdown>
            </div>
          </div>
        </div>
        <div class="row" *ngIf="showOcrSection">
          <div class="col-md-6">
            <div class="mt-4">
              <label class="mb-1" for="">OCR Profile</label>
              <select [(ngModel)]="channelsObject.ocrProfileId" name="ocrProfileId" class="form-select  py-2"
                aria-label="Default select example">
                <option disabled selected value="">All OCR Profile</option>
                <!-- <option [value]="item.clientId" *ngFor="let item of outhDetails">{{item.name}}</option> -->
              </select>
            </div>
          </div>
          <div class="col-md-6">
            <div class="mt-4">
              <!-- (change)="onChangeClient($event)" -->
              <label for="" class="mb-1">OCR Field Mapping</label>
              <select [(ngModel)]="channelsObject.ocrFieldMapping" name="ocrFieldMapping" class="form-select  py-2"
                aria-label="Default select example">
                <option disabled selected value="">All OCR Field Mapping</option>
                <!-- <option [value]="item.clientId" *ngFor="let item of outhDetails">{{item.name}}</option> -->
              </select>
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-6">
            <label for="" class="form-label">Max File Size (MB)</label>
            <input [(ngModel)]="channelsObject.maxFileSize" name="maxFileSize" type="text" class="form-control"
              name="filesize" />
          </div>
          <div class="col-md-6">
            <div>
              <label for="" class="form-label">Supported File Type</label>
              <p-multiSelect name="supportedFileTypes" [(ngModel)]="channelsObject.supportedFileTypes"
                [options]="supportedFiletype" [resetFilterOnHide]="true" required
                placeholder="Pick Supported File Type"></p-multiSelect>
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-6">
            <label for="" class="form-label">NPO Invoice Type</label>
            <input type="text" [(ngModel)]="channelsObject.npoInvoiceType" class="form-control" name="npoInvoiceType" />
          </div>
          <div class="col-md-6">
            <div>
              <label for="" class="form-label">PO Invoice Type</label>
              <input [(ngModel)]="channelsObject.poInvoiceType" type="text" class="form-control" name="poInvoiceType" />
            </div>
          </div>
        </div>
        <div>
        </div>
      </div>
      <div *ngIf="selectedTab === 2">
        <div class="row mt-3">
          <div class="col-md-6">
            <label for="" class="form-label">Host</label>
            <input [(ngModel)]="channelsObject.channelImapConfig.host" type="text" class="form-control" name="host" />
          </div>
          <div class="col-md-6">
            <div>
              <label for="" class="form-label">Mail Stored Protocol</label>
              <input [(ngModel)]="channelsObject.channelImapConfig.mailStoredProtocol" type="text" class="form-control"
                name="mailStoredProtocol" />
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-6">
            <label for="" class="form-label">Password</label>
            <input [(ngModel)]="channelsObject.channelImapConfig.password" type="text" class="form-control"
              name="password" />
          </div>
          <div class="col-md-6">
            <div>
              <label for="" class="form-label">port</label>
              <input [(ngModel)]="channelsObject.channelImapConfig.port" type="text" class="form-control" name="port" />
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-6">
            <label for="" class="form-label">Secured Connection</label>
            <input [(ngModel)]="channelsObject.channelImapConfig.securedConnection" type="text" class="form-control"
              name="securedConnection" />
          </div>
          <div class="col-md-6">
            <div>
              <label for="" class="form-label">SMTP Port</label>
              <input [(ngModel)]="channelsObject.channelImapConfig.smtpPort" type="text" class="form-control"
                name="smtpPort" />
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-6">
            <label for="" class="form-label">username</label>
            <input [(ngModel)]="channelsObject.channelImapConfig.username" type="text" class="form-control"
              name="username" />
          </div>
          <div class="col-md-6">
            <div>
              <label for="" class="form-label">SSl</label>
              <input [(ngModel)]="channelsObject.channelImapConfig.ssl" type="text" class="form-control" name="ssl" />
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div>
            <label for="" class="form-label">TLSV</label>
            <input [(ngModel)]="channelsObject.channelImapConfig.tlsV" type="text" class="form-control" name="tlsV" />
          </div>
        </div>
      </div>
    </form>
    <!-- form -->
  </div>
  <div class="canvas-footer d-flex align-items-center justify-content-end">
    <button (click)="onClose()" class="cancel-btn me-3">
      Cancel
    </button>
    <button matRipple class="common-btn" [disabled]="isWait || form.invalid" (click)="submit()">
      <ng-container *ngIf="isWait">
        <span clas="indicator-progress" [style.display]="'block'">
          Please wait...{{ " " }}
          <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
        </span>
      </ng-container>
      <ng-container *ngIf="!isWait">Update</ng-container>
    </button>
  </div>
</div>
