<!-- Add New Role (offcanvas)-->
<div class="pb-5" style="height: calc(100% - 50px);">
  <div class="d-flex pt-0 pe-0 border-bottom align-items-start justify-content-between">
    <div class="text-grey-3 fw-medium d-flex align-items-center gap-2 py-3 ps-3">
      <div class="icon-box icon-box-primary rounded-3 p-2 p-xxl-2 position-relative">
        <img src="./assets/images/role-details.png" alt="role">
      </div> Application
    </div>
    <button type="button" class="btn btn-cls" mat-dialog-close aria-label="Close"><img src="./assets/images/x.svg"
        alt=""></button>
  </div>
  <div class="px-4 py-3" style="height: calc(100% - 25px);overflow-y: auto;">
    <!-- form -->
    <form #appF="ngForm">
      <div class="row g-2 w-100">
        <div class="col-md-12">
          <label for="FirstName" class="form-label">App Name</label>
          <input type="text" class="form-control" name="appName" [(ngModel)]="applicationModel.appName" />
        </div>
        <div class="col-md-12">
          <label for="appId" class="form-label">App ID</label>
          <div class="d-flex inputDisabledBg">
            <input [type]="showAppId ? 'text' : 'password'" name="appID" class="form-control"
              [(ngModel)]="applicationModel.appId" disabled />
            <img [cdkCopyToClipboard]="applicationModel.appId" class="px-2 cursor-pointer"
              src="./assets/images/content-copy-outline.svg" />
            <img *ngIf="!showAppId" img src="./assets/images/eye.svg" matTooltip="View" alt=""
              class="me-3 cursor-pointer" (click)="showAppId = !showAppId">
            <img *ngIf="showAppId" img src="./assets/images/eye-off-outline.svg" matTooltip="Hide" alt=""
              class="me-3 cursor-pointer" (click)="showAppId = !showAppId">
          </div>
        </div>
        <div class="col-md-12">
          <label for="appSecret" class="form-label">App Secret</label>
          <div class="d-flex inputDisabledBg">
            <input [type]="showAppSecret ? 'text': 'password'" class="form-control" name="appSecret"
              [(ngModel)]="applicationModel.appSecret" disabled />
            <img [cdkCopyToClipboard]="applicationModel.appSecret" class="px-2 cursor-pointer"
              src="./assets/images/content-copy-outline.svg" />
            <img *ngIf="!showAppSecret" img src="./assets/images/eye.svg" matTooltip="View" alt=""
              class="me-3 cursor-pointer" (click)="showAppSecret = !showAppSecret">
            <img *ngIf="showAppSecret" img src="./assets/images/eye-off-outline.svg" matTooltip="Hide" alt=""
              class="me-3 cursor-pointer" (click)="showAppSecret = !showAppSecret">
          </div>
        </div>
        <div class="col-md-12">
          <label for="LastName" class="form-label">Encoding Method</label>
          <input type="text" class="form-control" name="encodingMethod" [(ngModel)]="applicationModel.encodingMethod">
        </div>
        <div class="col-md-12">
          <label for="LastName" class="form-label">Expiration Date</label>
          <!-- <input type="text" class="form-control" name="expiryDate" [(ngModel)]="applicationModel.expiryDate"> -->

          <div class="d-flex gap-2">
              <div class="input-with-icon w-100">
                <input type="text" class="form-control py-2" placeholder="Select" #dp="bsDatepicker" bsDatepicker
                  [bsConfig]="{
                    showWeekNumbers: false,
                    dateInputFormat: 'DD MMM YYYY'
                  }" [(ngModel)]="applicationModel.expiryDate" (ngModelChange)="onDateRangeSelected()" placement="top"
                  [minDate]="minDate" readonly name="expiryDate" />
                <div class="input-icon">
                  <img src="./assets/media/workspace/calendaricon.svg" alt="" (click)="dp.toggle()" />
                </div>
              </div>
            </div>
        </div>
        <div class="col-md-12">
          <label for="LastName" class="form-label">Ip White List</label>
          <input type="text" class="form-control" name="ipWhiteList" [(ngModel)]="applicationModel.ipWhiteList" />
        </div>
        <div class="col-md-12">
          <label for="LastName" class="form-label">Ip White List Enabled</label>
          <select name="ipWhiteListEnabled" [(ngModel)]="applicationModel.ipWhiteListEnabled" class="form-select">
            <option value="true">TRUE</option>
            <option value="false">FALSE</option>
          </select>
        </div>
        <div class="col-md-12">
          <label for="clientSecret" class="form-label">Logical System</label>
          <div class="dropdown-border w-100">
            <p-dropdown optionLabel="systemId" optionValue="systemId" [(ngModel)]="applicationModel.logicalSystem"
              name="logicalSystem" [options]="logicalSystems" placeholder="Select Logical System"
              optionDisabled="inactive"></p-dropdown>
          </div>
        </div>
        <div class="col-md-12">
          <label for="tenantId" class="form-label">Scope</label>
          <input type="text" class="form-control" name="scope" [(ngModel)]="applicationModel.scope" />
        </div>

      </div>
    </form>
    <!-- form -->
  </div>
  <div class="offcanvas-footer position-absolute bottom-0 bg-light px-3 py-2 w-100">
    <div>
      <div class="d-flex align-items-center gap-1" style="float: right;">
        <button type="button" class="btn btn-light px-3 me-2" mat-dialog-close>Cancel</button>
        <button type="button" class="btn btn-info px-5" [disabled]="appF.invalid"
          (click)="saveApplication()">Save</button>
      </div>
    </div>
  </div>
</div>
<!-- /Add New Role (offcanvas)-->
