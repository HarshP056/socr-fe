<div class="main-content bg-white w-100">
  <div class="row mx-0 pt-3 pt-lg-4">
    <div class="p-4 pt-0">
      <div class="col-sm-12 mb-3">
        <a routerLink="/system-admin/configurations" class="text-decoration-none d-flex align-items-center px-0">
          <h5 class="fw-semibold"><img src="./assets/images/arrow-left.svg" class="me-1" alt="arrow left"> OCR
            Profile</h5>
        </a>
        <div class="alert alert-warning d-flex align-items-start rounded-0 border-0 p-2 mb-3" role="alert">
          <img src="./assets/images/bulb.svg" class="me-2" alt="bilb">
          <div class="text-grey-4">
            Tailoring optical character recognition settings for optimal document analysis
          </div>
        </div>
      </div>
      <div class="col-lg-12 px-0 mb-3">
        <div
          class="d-flex align-items-center justify-content-between flex-wrap gap-3 bg-light-2 border border-dashed rounded-3 px-3">
          <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 pt-3 pb-0 pb-lg-3">
            <div class="position-relative search-form">
              <img src="./assets/images/search.svg" class="ms-2 position-absolute" alt="search icon">
              <input type="search" class="form-control w-sm-auto py-2" placeholder="Search by Profile Name" [(ngModel)]="queryParams.profileName">
            </div>
            <div >
              <p-dropdown appendTo="body" name="email" [options]="engineTypes" [(ngModel)]="queryParams.engineType"
                placeholder="Select Engine" [required]="true"></p-dropdown>
            </div>
            <div class="d-flex align-items-center gap-2 ms-2">
              <div>
                <button matRipple class="btn btn-info shadow" [disabled]="isLoading" (click)="search()">
                  <ng-container *ngIf="isLoading">
                    <span clas="indicator-progress" [style.display]="'block'">
                      Searching...{{ " " }}
                      <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                  </ng-container>
                  <span *ngIf="!isLoading">Search</span>
                </button>
              </div>
              <div>
                <button class="btn btn-light text-info-dark fw-semibold shadow bg-white me-3" matRipple [disabled]="resettingLoader" (click)="reset()">
                  <ng-container *ngIf="resettingLoader">
                    <span clas="indicator-progress" [style.display]="'block'">
                      Resetting...{{ " " }}
                      <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                  </ng-container>
                  <span *ngIf="!resettingLoader">Reset</span>
                </button>
              </div>
            </div>
          </div>
          <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 text-nowrap pb-3 pt-0 pt-lg-3">
            <a routerLink="create-ocr-profile" class="btn btn-info shadow"><img src="./assets/images/plus.svg"
                class="me-1" alt="add"> New
              Profile</a>
          </div>
        </div>
      </div>
      <div class="col-lg-12">
        <div class="table-responsive mt-4 px-0">
          <ng-container *ngIf="ocrProfile?.length && !initialLoader">
            <table mat-table matSort class="table user-management" [dataSource]="ocrProfile"
              (matSortChange)="sortChange($event)" matSortDirection="desc" matSortActive="id">
              <!-- <ng-container matColumnDef="logo">
                          <th mat-header-cell *matHeaderCellDef></th>
                          <td mat-cell *matCellDef="let element">
                            <span>
                              <img *ngIf="element.type === 'google'" style="width: 20px;"
                                src="./assets/media/Gmail_icon_(2020).svg.webp" alt="">
                              <img *ngIf="element.type === 'ms-graph'" style="width: 20px;"
                                src="./assets/media/Graph API logo.png" alt="">
                              <img *ngIf="element.type === 'ms-imap'" style="width: 63px;"
                                src="./assets/media/Office_365-Logo.wine (1).png" alt="">
                            </span>
                          </td>
                        </ng-container> -->
              <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                  OCR Profile ID
                </th>
                <td mat-cell *matCellDef="let element">
                  <p class="text-info-dark fw-semibold my-0">{{element.id}}</p>
                </td>
              </ng-container>
              <ng-container matColumnDef="engineType">
                <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                  Engine Type
                </th>
                <td mat-cell *matCellDef="let element">
                  <span class="badge-outline-warning" *ngIf="element.engineType === 'FCI'">FCI</span>
                  <span class="badge-outline-primary" *ngIf="element.engineType === 'SOCR'">SOCR</span>
                </td>
              </ng-container>

              <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                  OCR Profile Name
                </th>
                <td mat-cell *matCellDef="let element">

                  <p class="text-info fw-semibold my-0">{{element.name}}</p>
                </td>
              </ng-container>
              <ng-container matColumnDef="host">
                <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                  Host
                </th>
                <td mat-cell *matCellDef="let element">
                  <p class="text-grey-3 my-0">{{element.host}}</p>

                </td>
              </ng-container>

              <ng-container matColumnDef="projectNameOrGuid">
                <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                  Project ID
                </th>
                <td mat-cell *matCellDef="let element">
                  <p class="text-grey-3 my-0">{{element.projectId}}</p>
                </td>
              </ng-container>

              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef disableClear>
                  <span></span>
                </th>
                <td mat-cell *matCellDef="let element">

                  <div class="d-flex align-items-center gap-3">
                    <span [matMenuTriggerFor]="menu" class="cursor-pointer">
                      <img src="./assets/images/more-vertical.svg" alt="">
                    </span>
                  </div>
                  <mat-menu #menu="matMenu" xPosition="before">
                    <button class="mat-item" mat-menu-item (click)="Edit(element)">Edit</button>
                    <button class="mat-item" mat-menu-item (click)="openConfirmationModal(element)">Remove</button>
                    <!-- <button class="mat-item" mat-menu-item>Duplicate</button> -->
                  </mat-menu>
                </td>
              </ng-container>
              <!-- ================================================================ -->
              <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns" class=""></tr>
            </table>
            <div *ngIf="!initialLoader">
              <mat-paginator showFirstLastButtons [length]="total" [pageSize]="this.queryParams.limit" (page)="onPageChange($event)"
                [pageIndex]="page-1" [pageSizeOptions]="limits" (page)="pageEvent = $event">
              </mat-paginator>
            </div>
          </ng-container>
        </div>


      </div>
      <div class="center d-flex flex-column align-items-center mt-5" *ngIf="!ocrProfile?.length && !initialLoader">
        No records found !
      </div>
      <div class="center h-100" *ngIf="initialLoader">
        <app-page-loader class="v-center"></app-page-loader>
      </div>
    </div>
  </div>
</div>
<!-- Delete Confirmation -->
<app-delete-confirmation-modal #deleteModal [content]="
    'Be careful, this process can not be undone. Are you sure you want to delete this Ocr Profile'
  " [isLoading]="isDelete" (hidden)="deleteModal.hide()" (yes)="deleteOcrProfile()"
  (no)="deleteModal.hide()"></app-delete-confirmation-modal>
