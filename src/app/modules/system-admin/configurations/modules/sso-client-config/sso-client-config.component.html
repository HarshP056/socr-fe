<div class="bg-white">
    <div class="row mx-0 pt-3 pt-lg-4">
      <div class="p-4 pt-0">
        <div class="col-sm-12 mb-3">
          <a routerLink="/system-admin/integrations" class="text-decoration-none d-flex align-items-center px-0">
            <h5 class="fw-semibold"><img src="./assets/images/arrow-left.svg" class="me-1" alt="arrow left">SSO Client Configuration</h5>
          </a>
          <!-- <div class="alert alert-warning d-flex align-items-start rounded-0 border-0 p-2 mb-3" role="alert">
            <img src="./assets/images/bulb.svg" class="me-2" alt="bilb">
            <div class="text-grey-4">
              Lorem ipsum dolor sit amet consectetur. Est blandit cursus tellus mi sagittis ac euismod dignissim. Cursus
              scelerisque iaculis arcu vitae in morbi pulvinar tempus cursus.
            </div>
          </div> -->
        </div>
        <div class="col-lg-12 px-0 mb-3">
          <form action=""
            class="d-flex align-items-center justify-content-between flex-wrap gap-3 bg-light-2 border border-dashed rounded-3 px-3">
            <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 pt-3 pb-0 pb-lg-3">
              <!-- <div class="position-relative search-form-end">
                <input type="search" class="form-control w-sm-auto py-2" placeholder="Search by Name">
                <img src="./assets/images/search.svg" class="ms-2 position-absolute" alt="search icon">
              </div>
              <div class="dropdown-border">
                <p-dropdown appendTo="body" name="email" [options]="emailTemplateTypes"
                  placeholder="Select Clients"  [required]="true"></p-dropdown>
              </div> -->
            </div>
            <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 text-nowrap pb-3 pt-0 pt-lg-3">
              <a (click)="openDialog('')" class="btn btn-info shadow"><img src="./assets/images/plus.svg"
                  class="me-1" alt="add"> Create New </a>
            </div>
          </form>
        </div>
        <div class="col-lg-12">
          <div class="table-responsive mt-4 px-0" *ngIf="ssoClientConfigData?.length && !initialLoader">
            <table class="table user-management" mat-table [dataSource]="ssoClientConfigData"
             matSortDirection="desc" matSortActive="createdDate">
              <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let element">
                  <div class="d-flex align-items-center flex-wrap">
                    <div class="fw-semibold">
                      <p class="text-info-dark fw-semibold mb-2">{{element.name}}</p>
                    </div>
                  </div>
                </td>
              </ng-container>
              <ng-container matColumnDef="scope">
                <th mat-header-cell *matHeaderCellDef>Scope</th>
                <td mat-cell *matCellDef="let element">
                  <span class="word-break">{{element.scope}}</span>
                </td>
              </ng-container>
              <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef>Type</th>
                <td mat-cell *matCellDef="let element">
                  <span class="word-break">{{element.type}}</span>
                </td>
              </ng-container>
              <ng-container matColumnDef="redirectURI">
                <th mat-header-cell *matHeaderCellDef>Redirect URI</th>
                <td mat-cell *matCellDef="let element">
                    <span class="word-break">{{element.redirectURI}}</span>
                </td>
              </ng-container>
              <ng-container matColumnDef="clientId">
                <th mat-header-cell *matHeaderCellDef>Client ID</th>
                <td mat-cell *matCellDef="let element">
                    <span class="word-break">{{element.clientId}}</span>
                </td>
              </ng-container>
              <ng-container matColumnDef="tenantId">
                <th mat-header-cell *matHeaderCellDef>Tenant ID</th>
                <td mat-cell *matCellDef="let element">
                    <span class="word-break">{{element.tenantId}}</span>
                </td>
              </ng-container>
              <ng-container matColumnDef="createdDate">
                <th mat-header-cell *matHeaderCellDef>Created On</th>
                <td mat-cell *matCellDef="let element">
                    <span class="word-break">{{element.createdDate | date:'medium'}}</span>
                </td>
              </ng-container>
              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let element">
                  <div class="text-start">
                    <img src="./assets/images/more-vertical.svg" #ddTrigger="matMenuTrigger" [matMenuTriggerFor]="dd"
                      class="cursor-pointer">
                    <mat-menu #dd="matMenu" [overlapTrigger]="false">
                      <div class="dropdown">
                        <div class="action-frame">
                          <!-- <div class="mx-3 cursor-pointer" (click)="openDialog(element.id)">Edit</div> -->
                          <div class="mx-3 cursor-pointer" (click)="openDialog(element.id)">Edit</div>
                          <hr class="hr-line text-gray-400" />
                          <div class="mx-3 cursor-pointer" (click)="openConfirmationModal(element)">Remove</div>
                        </div>
                      </div>
                    </mat-menu>
                  </div>
                </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
            <!-- <div *ngIf="!initialLoader">
                <mat-paginator (page)="onPageChange($event)" [length]='totalElements' [pageIndex]="pageInd"
                  [pageSize]="queryParams.limit" [pageSizeOptions]="[5, 10, 20, 50, 100]" aria-label="Select page">
                </mat-paginator>
            </div> -->
          </div>
          <div class="center d-flex flex-column align-items-center mt-5"
            *ngIf="!ssoClientConfigData?.length && !initialLoader">
            No records found !
          </div>
          <div class="center h-100 mt-5" *ngIf="initialLoader">
            <app-page-loader class="v-center"></app-page-loader>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation -->
  <app-delete-confirmation-modal #deleteModal [content]="
  'Be careful, this process can not be undone. Are you sure you want to delete this SSO Client Configuration?'
  " [isLoading]="isDelete" (hidden)="deleteModal.hide()" (yes)="deleteSSOClientConfig()"
    (no)="deleteModal.hide()"></app-delete-confirmation-modal>

  <!-- Delete Confirmation -->
