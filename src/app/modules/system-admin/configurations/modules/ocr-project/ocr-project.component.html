<div class="main-content bg-white w-100">
  <div class="row mx-0 pt-3 pt-lg-4">
    <div class="p-4 pt-0">

      <div class="col-sm-12 mb-3">
        <a routerLink="/system-admin/configurations" class="text-decoration-none d-flex align-items-center px-0">
          <h5 class="fw-semibold"><img src="./assets/images/arrow-left.svg" class="me-1" alt="arrow left"> OCR Project Creation</h5>
        </a>
      </div>

      <div class="col-lg-12 px-0 mb-3">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 bg-light-2 border border-dashed rounded-3 px-3">
          <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 pt-3 pb-0 pb-lg-3">

            <div class="position-relative search-form">
              <img src="./assets/images/search.svg" class="ms-2 position-absolute" alt="search icon">
              <input type="search" class="form-control w-sm-auto py-2" placeholder="Search by Project Name" [(ngModel)]="queryParams.profileName">
            </div>

            <div class="d-flex align-items-center gap-2 ms-2">
              <div>
                <button matRipple class="btn btn-info shadow" [disabled]="isLoading" (click)="search()">
                  <ng-container *ngIf="isLoading">
                    <span clas="indicator-progress" [style.display]="'block'">
                      Searching...{{ " " }}
                      <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                  </ng-container>
                  <span *ngIf="!isLoading">Search</span>
                </button>
              </div>
              <div>
                <button class="btn btn-light text-info-dark fw-semibold shadow bg-white me-3" matRipple [disabled]="resettingLoader" (click)="reset()">
                  <ng-container *ngIf="resettingLoader">
                    <span clas="indicator-progress" [style.display]="'block'">
                      Resetting...{{ " " }}
                      <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                    </span>
                  </ng-container>
                  <span *ngIf="!resettingLoader">Reset</span>
                </button>
              </div>
            </div>

          </div>

          <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 text-nowrap pb-3 pt-0 pt-lg-3">
            <a routerLink="create" class="btn btn-info shadow"><img src="./assets/images/plus.svg"
                class="me-1" alt="add"> New Profile</a>
            <button [disabled]="isDownload || !exportButton" (click)="export()"
                class="btn btn-info shadow gap-2 d-lg-flex px-3 py-2 rounded fw-semibold d-flex align-items-center justify-content-center">
                <ng-container *ngIf="isDownload">
                  <span class="indicator-progress" style="text-align: center;">
                    Please wait...
                    <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                  </span>
                </ng-container>
                <ng-container *ngIf="!isDownload">
                  <span class="indicator-label"> Export </span>
                </ng-container>
            </button>
          </div>

        </div>
      </div>

      <div class="col-lg-12">
        <div class="table-responsive mt-4 px-0">
          <ng-container *ngIf="ocrProfile?.length && !initialLoader">
            <table mat-table matSort class="table user-management" [dataSource]="ocrProfile"
              (matSortChange)="sortChange($event)" matSortDirection="desc" matSortActive="id">
              <ng-container matColumnDef="check">
                <th mat-header-cell *matHeaderCellDef disableClear></th>
                <td mat-cell *matCellDef="let element; let i=index">
                  <input (change)="select($event, element)" [(ngModel)]="element.multiSelect"
                    class="form-check-input cursor-pointer mb-1" type="checkbox" name="multiSelect" id="issuccess" />
                </td>
              </ng-container>

              <ng-container matColumnDef="projectId">
                <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                  Project Id
                </th>
                <td mat-cell *matCellDef="let element">
                  <p class="text-grey-3 my-0">{{element.projectId}}</p>
                </td>
              </ng-container>

              <ng-container matColumnDef="projectNameOrGuid">
                <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                  Project Name
                </th>
                <td mat-cell *matCellDef="let element">
                  <p class="text-grey-3 my-0">{{element.projectNameOrGuid}}</p>
                </td>
              </ng-container>

              <ng-container matColumnDef="pageSize">
                <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                  Page Size
                </th>
                <td mat-cell *matCellDef="let element">
                  <p class="text-info fw-semibold my-0">{{element.pageSize}}</p>
                </td>
              </ng-container>

              <ng-container matColumnDef="logicalSystem">
                <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                  System
                </th>
                <td mat-cell *matCellDef="let element">
                  <p class="text-info fw-semibold my-0">{{element.logicalSystem}}</p>
                </td>
              </ng-container>

              <ng-container matColumnDef="autoVerification">
                <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
                  Auto Verification
                </th>
                <td mat-cell *matCellDef="let element">
                  <p class="text-grey-3 my-0" *ngIf="!element.auto" >No</p>
                  <p class="text-grey-3 my-0" *ngIf="element.auto" >Yes</p>
                </td>
              </ng-container>

              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef disableClear>
                  <span></span>
                </th>
                <td mat-cell *matCellDef="let element">
                  <div class="d-flex gap-3">
                    <a class="cursor-pointer" (click)="Edit(element)" >
                      <img src="./assets/images/edit-01.svg" alt="edit" title="Edit" />
                    </a>
                  <a class="cursor-pointer" (click)="openConfirmationModal(element)">
                    <img src="./assets/images/trash-02.svg" alt="delete" title="Delete" />
                  </a>
                  <a class="cursor-pointer" (click)="duplicate(element)">
                    <img src="./assets/images/duplicate.png" alt="duplicate" title="Copy" style="width: 70%;" />
                  </a>
                </div>
                </td>

              </ng-container>
              <!-- ================================================================ -->
              <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns" class=""></tr>
            </table>

            <div *ngIf="!initialLoader">
              <mat-paginator showFirstLastButtons [length]="total" [pageSize]="this.queryParams.limit" (page)="onPageChange($event)"
                [pageIndex]="page-1" [pageSizeOptions]="limits" (page)="pageEvent = $event">
              </mat-paginator>
            </div>

          </ng-container>
        </div>

      </div>

      <div class="center d-flex flex-column align-items-center mt-5" *ngIf="!ocrProfile?.length && !initialLoader">
        No records found !
      </div>

      <div class="center h-100" *ngIf="initialLoader">
        <app-page-loader class="v-center"></app-page-loader>
      </div>

    </div>
  </div>
</div>

  <!-- Delete Confirmation -->
  <app-delete-confirmation-modal #deleteModal [content]="
      'Be careful, this process can not be undone. Are you sure you want to delete this Ocr Profile'
    " [isLoading]="isDelete" (hidden)="deleteModal.hide()" (yes)="deleteOcrProject()"
    (no)="deleteModal.hide()"></app-delete-confirmation-modal>

  <!-- Delete Confirmation -->
