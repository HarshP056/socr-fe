<div class="main-content bg-white w-100">
  <div class="row mx-0 pt-3 pt-lg-4">
    <div class="p-4 pt-0">
      <div class="col-sm-12 mb-3">
        <a routerLink="/system-admin/intelligence-hub" class="text-decoration-none d-flex align-items-center px-0">
          <h5 class="fw-semibold"><img src="./assets/images/arrow-left.svg" class="me-1" alt="arrow left">Vendor Determination Open AI Config</h5>
        </a>
        <div class="alert alert-warning d-flex align-items-start rounded-0 border-0 p-2 mb-3" role="alert">
          <img src="./assets/images/bulb.svg" class="me-2" alt="bilb">
          <div class="text-grey-4">
            Defining Vendor Determination Open AI Config.
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <input type="text" class="form-control" [(ngModel)]="aiPromptCriteria.promptName" value="VENDOR_DETERMINATION" readonly>
        </div>
        <div class="col-md-6 mb-3">
          <input type="text" class="form-control" [(ngModel)]="aiPromptCriteria.modelName" readonly>
        </div>
        <div class="col-md-6 mb-3">
          <input type="text" class="form-control" [(ngModel)]="aiPromptCriteria.temperature"  placeholder="model">
        </div>
        <div class="col-md-6 mb-3">
          <select class="form-control" id="category" [(ngModel)]="aiPromptCriteria.responseFormat">
            <option value="" disabled selected>Select Response Format</option>
            <option value="json_object"  [selected]="aiPromptCriteria.responseFormat === 'json_object'">json_object</option>
            <option value="json_schema"  [selected]="aiPromptCriteria.responseFormat === 'json_schema'">json_schema</option>
          </select>
        </div>
      </div>
      <div class="col-lg-12">
        <nav>
          <div class="nav nav-underline" id="nav-tab" role="tablist">
            <button class="nav-link px-2 active tab tab-text" id="nav-instructionList-tab" data-bs-toggle="tab" data-bs-target="#nav-instructionList"
              type="button" role="tab" aria-controls="nav-instructionList" aria-selected="true">
              Instruction List
            </button>
            <button class="nav-link px-2 tab-text" id="nav-contextDetails-tab" data-bs-toggle="tab" data-bs-target="#nav-contextDetails"
              type="button" role="tab" aria-controls="nav-contextDetails" aria-selected="true">
              Context Details
            </button>
            <button class="nav-link px-2 tab-text" id="nav-responseInstruction-tab" data-bs-toggle="tab" data-bs-target="#nav-responseInstruction"
              type="button" role="tab" aria-controls="nav-responseInstruction" aria-selected="true">
              Response Instruction
            </button>
          </div>
        </nav>
        <form #savePromptData="ngForm">
          <div class="tab-content" id="nav-tabContent">
            <div class="tab-pane fade show active mt-3" id="nav-instructionList" role="tabpanel" aria-labelledby="nav-instructionList-tab"
              tabindex="0">
              <div class="row">
                <div class="col-lg-9 col-xxl-9">
                  <div class="table-responsive table-top-rounded-radius border-top-0 border-bottom-0 px-0">
                    <table class="table table-bordered user-management mb-0">
                      <thead>
                        <tr>
                          <th scope="col">
                            <span class="text-uppercase">Prompts</span>
                          </th>
                          <th scope="col"></th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr *ngFor="let data of instructionList; let i=index">
                          <td>
                            <input type="text" name="metaprompt{{i}}" #metaprompt="ngModel" class="form-control py-2"
                              [(ngModel)]="data.name" required />
                            <small style="color:red" *ngIf="!metaprompt.value && (metaprompt?.dirty || metaprompt?.touched)">Please
                                enter prompt</small>
                          </td>
                          <td style="width: 50px">
                            <a class="cursor-pointer" (click)="removeInstructionList(i)"><img src="./assets/images/trash-02.svg"
                                alt="delete" /></a>
                          </td>
                        </tr>
                        <tr>
                          <td colspan="2">
                            <button class="btn btn-info shadow" (click)="addInstructionList()">
                              <img src="./assets/images/plus.svg" alt="add" />
                              Add New
                            </button>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
            <div class="tab-pane fade mt-3" id="nav-contextDetails" role="tabpanel" aria-labelledby="nav-contextDetails-tab"
              tabindex="1">
              <div class="row">
                <div class="col-lg-9 col-xxl-9">
                  <div class="table-responsive table-top-rounded-radius border-top-0 border-bottom-0 px-0">
                    <table class="table table-bordered user-management mb-0">
                      <thead>
                        <tr>
                          <th scope="col">
                            <span class="text-uppercase">Context</span>
                          </th>
                          <th scope="col"></th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr *ngFor="let data of contextDetails; let i=index">
                          <td>
                            <input type="text" name="context{{i}}" #context="ngModel" class="form-control py-2"
                              [(ngModel)]="data.name" required />
                            <small style="color:red" *ngIf="!context.value && (context?.dirty || context?.touched)">Please
                              enter context</small>
                          </td>
                          <td style="width: 50px">
                            <a class="cursor-pointer" (click)="removeContextDetails(i)"><img
                                src="./assets/images/trash-02.svg" alt="delete" /></a>
                          </td>
                        </tr>
                        <tr>
                          <td colspan="2">
                            <button class="btn btn-info shadow" (click)="addContextDetails()">
                              <img src="./assets/images/plus.svg" class="me-1" alt="add" />
                              Add New
                            </button>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
            <div class="tab-pane fade mt-3" id="nav-responseInstruction" role="tabpanel" aria-labelledby="nav-responseInstruction-tab"
            tabindex="2">
            <div class="row">
              <div class="col-lg-9 col-xxl-9">
                <div class="table-responsive table-top-rounded-radius border-top-0 border-bottom-0 px-0">
                  <table class="table table-bordered user-management mb-0">
                    <thead>
                      <tr>
                        <th scope="col">
                          <span class="text-uppercase">Context Description</span>
                        </th>
                        <th scope="col"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr *ngFor="let data of responseInstruction; let i=index">
                        <td>
                          <input type="text" name="contextDescription{{i}}" #contextDescription="ngModel" class="form-control py-2"
                            [(ngModel)]="data.name" required />
                          <small style="color:red" *ngIf="!contextDescription.value && (contextDescription?.dirty || contextDescription?.touched)">Please
                              enter prompt</small>
                        </td>
                        <td style="width: 50px">
                          <a class="cursor-pointer" (click)="removeResponseInstruction(i)"><img src="./assets/images/trash-02.svg"
                              alt="delete" /></a>
                        </td>
                      </tr>
                      <tr>
                        <td colspan="2">
                          <button class="btn btn-info shadow" (click)="addResponseInstruction()">
                            <img src="./assets/images/plus.svg" alt="add" />
                            Add New
                          </button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          </div>
        </form>
        <div class="row mt-3">
          <div class="d-flex align-items-center justify-content-end">
            <button routerLink="/system-admin/configurations" class="cancel-btn me-3">
              Cancel
            </button>
            <button matRipple class="common-btn" [disabled]="isWait || !savePromptData.valid" (click)="submitUpdateCall()">
              <ng-container *ngIf="isWait">
                <span clas="indicator-progress" [style.display]="'block'">
                  Please wait...{{ " " }}
                  <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                </span>
              </ng-container>
              <ng-container *ngIf="!isWait">Update</ng-container>
            </button>
          </div>
        </div>
      </div>
      <div class="center h-100" *ngIf="initialLoader">
        <app-page-loader class="v-center"></app-page-loader>
      </div>
    </div>
  </div>
</div>
