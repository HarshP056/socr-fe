<div class="container-fluid px-0">
  <div class="wrapper h-calc d-flex justify-content-center">
    <div class="wrapper-content d-flex justify-content-center w-100 flex-wrap">
      <div class="bg-white w-100">
        <div class="row mx-0 p-3 p-lg-4 pt-lg-3">
          <a routerLink="/system-admin/integrations" class="text-decoration-none d-flex align-items-center px-0">
            <h5 class="fw-semibold"><img src="./assets/images/arrow-left.svg" class="me-1" alt="arrow left"> OAuth
              Profile</h5>
          </a>
          <!-- <div class="alert alert-warning d-flex align-items-start rounded-0 border-0 p-2" role="alert">
            <img src="./assets/images/bulb.svg" class="me-2" alt="bilb">
            <div class="text-grey-4">
              User management involves the administration and control of user access, permissions, and
              privileges within a system or platform to ensure secure and appropriate usage.
              <a href="#" class="fw-semibold">Click Here</a> to download the template for bulk user
              import
            </div>
          </div> -->
          <div class="col-lg-12 mb-2 px-0">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 bg-light-2 border
                        border-dashed rounded-3 px-3">
              &nbsp;
              <div
                class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 text-nowrap pb-3 pt-0 pt-lg-3">
                <div>
                  <button class="btn btn-info shadow" type="button" (click)="openDialog('')"
                    aria-controls="offcanvasWithBothOptions"><img src="./assets/images/plus.svg" class="me-1" alt="add">
                    New Auth Profile</button>
                </div>
              </div>
            </div>
            <!-- Add New Role (offcanvas)-->
            <div class="offcanvas offcanvas-end pb-5" data-bs-scroll="true" tabindex="-1" id="offcanvasWithBothOptions"
              aria-labelledby="offcanvasWithBothOptionsLabel">
              <div class="offcanvas-header pt-0 pe-0 border-bottom">
                <div class="text-grey-3 fw-medium d-flex align-items-center gap-2 pt-3"
                  id="offcanvasWithBothOptionsLabel">
                  <div class="icon-box icon-box-primary rounded-3 p-2 p-xxl-2 position-relative">
                    <img src="./assets/images/role-details.png" alt="role">
                  </div> User Details
                </div>
                <button type="button" class="btn btn-cls" data-bs-dismiss="offcanvas" aria-label="Close"><img
                    src="./assets/images/x.svg" alt=""></button>
              </div>
              <div class="offcanvas-body px-xl-5">
                <!-- form -->
                <form class="">
                  <div class="row g-3 w-100">
                    <div class="col-md-6">
                      <label for="FirstName" class="form-label">First Name</label>
                      <input type="text" class="form-control" id="FirstName">
                    </div>
                    <div class="col-md-6">
                      <label for="LastName" class="form-label">Last Name</label>
                      <input type="text" class="form-control" id="LastName">
                    </div>
                    <div class="col-md-12">
                      <label for="inputEmail4" class="form-label">Email ID</label>
                      <input type="email" class="form-control" id="inputEmail4">
                    </div>
                    <div class="col-12">
                      <label for="inputAddress2" class="form-label">Phone</label>
                      <div class="row">
                        <div class="col-md-2">
                          <input type="text" class="form-control" placeholder="Code">
                        </div>
                        <div class="col-md-5 px-md-0">
                          <input type="text" class="form-control" placeholder="Phone Number">
                        </div>
                        <div class="col-md-5">
                          <input type="text" class="form-control" placeholder="Ext.">
                        </div>
                      </div>
                    </div>
                    <div class="col-12">
                      <select class="form-select w-100" aria-label="Default select example">
                        <option selected>Standard</option>
                        <option value="1">Open this select menu</option>
                      </select>
                    </div>
                    <div class="col-12">
                      <button type="button" class="btn btn-light px-3 py-2"><span class="fw-semibold">Permissions</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
                          <path
                            d="M1.41174 7.41586C1.3323 7.29007 1.29257 7.22717 1.27034 7.13016C1.25364 7.0573 1.25364 6.94238 1.27034 6.86951C1.29257 6.7725 1.3323 6.70961 1.41174 6.58382C2.06823 5.54433 4.02232 2.9165 7.00024 2.9165C9.97815 2.9165 11.9322 5.54433 12.5887 6.58382C12.6682 6.70961 12.7079 6.7725 12.7301 6.86951C12.7468 6.94238 12.7468 7.0573 12.7301 7.13016C12.7079 7.22717 12.6682 7.29007 12.5887 7.41586C11.9322 8.45535 9.97815 11.0832 7.00024 11.0832C4.02232 11.0832 2.06823 8.45535 1.41174 7.41586Z"
                            stroke="#12344D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                          <path
                            d="M7.00024 8.74984C7.96673 8.74984 8.75024 7.96634 8.75024 6.99984C8.75024 6.03334 7.96673 5.24984 7.00024 5.24984C6.03374 5.24984 5.25024 6.03334 5.25024 6.99984C5.25024 7.96634 6.03374 8.74984 7.00024 8.74984Z"
                            stroke="#12344D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg></button>
                    </div>
                  </div>
                </form>
                <!-- form -->
              </div>
              <div class="offcanvas-footer position-absolute bottom-0 bg-light p-3 w-100">
                <div class="d-flex justify-content-end">
                  <div class="d-flex align-items-center gap-3">
                    <button type="button" class="btn btn-light px-3">Cancel</button>
                    <button type="button" class="btn btn-info px-5">Save</button>
                  </div>
                </div>
              </div>
            </div>
            <!-- /Add New Role (offcanvas)-->
            <div class="col-lg-12">
              <div class="table-responsive mt-4 px-0" *ngIf="oauthProfiles?.length && !initialLoader">
                <table class="table user-management" mat-table [dataSource]="oauthProfiles">
                  <ng-container matColumnDef="logo">
                    <th mat-header-cell *matHeaderCellDef></th>
                    <td mat-cell *matCellDef="let element">
                      <span>
                        <img *ngIf="element.type === 'google'" style="width: 20px;"
                          src="./assets/media/Gmail_icon_(2020).svg.webp" alt="">
                        <img *ngIf="element.type === 'ms-graph'" style="width: 20px;"
                          src="./assets/media/Graph API logo.png" alt="">
                        <img *ngIf="element.type === 'ms-imap'" style="width: 63px;"
                          src="./assets/media/Office_365-Logo.wine (1).png" alt="">
                      </span>
                    </td>
                  </ng-container>
                  <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name </th>
                    <td mat-cell *matCellDef="let element">
                      <span class="text-info-dark fw-semibold">{{element.name}}</span>
                    </td>
                  </ng-container>

                  <ng-container matColumnDef="type">
                    <th mat-header-cell *matHeaderCellDef>Type</th>
                    <td mat-cell *matCellDef="let element">
                      <span class="fw-semibold text-truncate">{{element.type}}</span>
                    </td>
                  </ng-container>

                  <ng-container matColumnDef="clientId">
                    <th mat-header-cell *matHeaderCellDef>Client Id</th>
                    <td mat-cell *matCellDef="let element">
                      <span class="word-break">{{element.clientId}}</span>
                    </td>
                  </ng-container>

                  <ng-container matColumnDef="redirectURI">
                    <th mat-header-cell *matHeaderCellDef>Redirect URI</th>
                    <td mat-cell *matCellDef="let element">
                      <span class="word-break">{{element.redirectURI}}</span>
                    </td>
                  </ng-container>

                  <ng-container matColumnDef="createdDate">
                    <th mat-header-cell *matHeaderCellDef>Created Date</th>
                    <td mat-cell *matCellDef="let element">
                      <span class="fw-semibold text-truncate">{{element.createdDate | date:'MM-dd-yyyy HH:mm a'}}</span>
                    </td>
                  </ng-container>

                  <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let element">
                      <div class="text-center">
                        <img src="./assets/images/more-vertical.svg" #ddTrigger="matMenuTrigger"
                          [matMenuTriggerFor]="dd" class="cursor-pointer">
                        <mat-menu #dd="matMenu" [overlapTrigger]="false">
                          <div class="dropdown">
                            <div class="action-frame">
                              <div class="mx-3 cursor-pointer" (click)="openDialog(element.id)">Edit</div>
                              <hr class="hr-line text-gray-400" />
                              <div class="mx-3 cursor-pointer" (click)="deleteOauthProfile(element.id)">Remove</div>
                            </div>
                          </div>
                        </mat-menu>
                      </div>
                    </td>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
              </div>
            </div>
            <div class="center d-flex flex-column align-items-center mt-5" *ngIf="!oauthProfiles.length && !initialLoader">
              No records found !
            </div>
            <div class="center h-100" *ngIf="initialLoader">
              <app-page-loader class="v-center"></app-page-loader>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
