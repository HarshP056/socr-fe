<!-- Add New Role (offcanvas)-->
<div class="pb-5" style="height: calc(100% - 50px);">
  <div class="d-flex pt-0 pe-0 border-bottom align-items-start justify-content-between">
    <div class="text-grey-3 fw-medium d-flex align-items-center gap-2 py-3 ps-3">
      <div class="icon-box icon-box-primary rounded-3 p-2 p-xxl-2 position-relative">
        <img src="./assets/images/role-details.png" alt="role">
      </div> Oauth Profile
    </div>
    <div class="d-flex align-items-center">
      <span class="help-badge me-2 px-2 rounded-2 text-danger" *ngIf="showDocs()" (click)="openHelpDocs()">Help Docs for {{oauthProfile.oauthType}}</span>
      <button type="button" class="btn btn-cls" mat-dialog-close aria-label="Close"><img src="./assets/images/x.svg"
        alt=""></button>
    </div>

  </div>
  <div class="px-4 py-3" style="height: calc(100% - 25px);overflow-y: auto;">
    <!-- form -->
    <form #oauthF="ngForm">
      <div class="row g-2 w-100">
        <div class="col-md-12">
          <label for="" class="form-label">Name</label>
          <input type="text" class="form-control" name="name" [(ngModel)]="oauthProfile.name"  />
        </div>
        <div class="col-md-12">
          <label for="" class="form-label">Oauth Type</label>
          <div class="dropdown-border w-100">
            <p-dropdown name="oauthType" [(ngModel)]="oauthProfile.oauthType" [options]="authTypes"
              placeholder="Select Oauth Types" optionDisabled="inactive" [required]="true"></p-dropdown>
          </div>
          <!-- (onChange)="selectedType($event)" -->
        </div>
        <div class="col-md-12">
          <label for="" class="form-label">Type</label>
          <div class="dropdown-border w-100">
            <p-dropdown name="type" [(ngModel)]="oauthProfile.type" [options]="types" placeholder="Select Types"
              optionDisabled="inactive" [required]="true"></p-dropdown>
          </div>
          <!-- <input type="text" class="form-control" name="type" [(ngModel)]="oauthProfile.type"> -->
        </div>
        <div class="col-md-12">
          <label for="" class="form-label">Scope</label>
          <input type="text" class="form-control" name="scope" [(ngModel)]="oauthProfile.scope" />
        </div>
        <div class="col-md-12">
          <label for="" class="form-label">Client Id</label>
          <input type="text" class="form-control" name="clientId" [(ngModel)]="oauthProfile.clientId" />
        </div>
        <div class="col-md-12">
          <label for="" class="form-label">Client Secret</label>
          <input [type]="show ? 'email' : 'password'" class="form-control" name="clientSecret" [(ngModel)]="oauthProfile.clientSecret" (blur)="show=false" (focus)="show=true"/>
        </div>
        <div class="col-md-12">
          <label for="" class="form-label">Tenant Id</label>
          <input type="text" class="form-control" name="tenantId" [(ngModel)]="oauthProfile.tenantId" />
        </div>
        <div class="col-md-12">
          <label for="" class="form-label">Redirect URL</label>
          <input type="text" class="form-control" name="redirectURI" [(ngModel)]="oauthProfile.redirectURI" />
        </div>
      </div>
    </form>
    <!-- form -->
  </div>
  <div class="canvas-footer d-flex align-items-center justify-content-end">
    <button (click)="onClose()" class="cancel-btn me-3">
      Cancel
    </button>
    <button matRipple class="common-btn" [disabled]="isWait || oauthF.invalid" (click)="submit()">
      <ng-container *ngIf="isWait">
        <span clas="indicator-progress" [style.display]="'block'">
          Please wait...{{ " " }}
          <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
        </span>
      </ng-container>
      <ng-container *ngIf="!isWait && editMode === 'new'">Save</ng-container>
      <ng-container *ngIf="!isWait && editMode === 'edit'">Update</ng-container>
    </button>
  </div>
  <!-- <div class="offcanvas-footer position-absolute bottom-0 bg-light px-3 py-2 w-100">
    <div>
      <div class="d-flex align-items-center gap-1" style="float: right;">
        <button type="button" class="btn btn-light px-3 me-2" mat-dialog-close>Cancel</button>
        <button type="button" class="btn btn-info px-5" [disabled]="oauthF.invalid" mat-dialog-close
          (click)="saveOauthProfile()">Save</button>
      </div>
    </div>
  </div> -->
</div>
<!-- /Add New Role (offcanvas)-->
