<div class="bg-white">
  <div class="row mx-0 pt-3 pt-lg-4">
    <div class="p-4 pt-0">
      <div class="col-sm-12 mb-3">
        <a routerLink="/system-admin/configurations" class="text-decoration-none d-flex align-items-center px-0">
          <h5 class="fw-semibold"><img src="./assets/images/arrow-left.svg" class="me-1" alt="arrow left"> Email
            Templates</h5>
        </a>
        <!-- <div class="alert alert-warning d-flex align-items-start rounded-0 border-0 p-2 mb-3" role="alert">
          <img src="./assets/images/bulb.svg" class="me-2" alt="bilb">
          <div class="text-grey-4">
            Lorem ipsum dolor sit amet consectetur. Est blandit cursus tellus mi sagittis ac euismod dignissim. Cursus
            scelerisque iaculis arcu vitae in morbi pulvinar tempus cursus.
          </div>
        </div> -->
      </div>
      <div class="col-lg-12 px-0 mb-3">
        <form action=""
          class="d-flex align-items-center justify-content-between flex-wrap gap-3 bg-light-2 border border-dashed rounded-3 px-3">
          <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 pt-3 pb-0 pb-lg-3">
            <!-- <div class="position-relative search-form-end">
              <input type="search" class="form-control w-sm-auto py-2" placeholder="Search by Name">
              <img src="./assets/images/search.svg" class="ms-2 position-absolute" alt="search icon">
            </div>
            <div class="dropdown-border">
              <p-dropdown appendTo="body" name="email" [options]="emailTemplateTypes"
                placeholder="Select Clients"  [required]="true"></p-dropdown>
            </div> -->
          </div>
          <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 text-nowrap pb-3 pt-0 pt-lg-3">
            <a routerLink="create-email-template" class="btn btn-info shadow"><img src="./assets/images/plus.svg"
                class="me-1" alt="add"> Create New </a>
            <button [disabled]="isDownload || !exportButton" (click)="export()"
                class="btn btn-info shadow gap-2 d-lg-flex px-3 py-2 rounded fw-semibold d-flex align-items-center justify-content-center">
                <ng-container *ngIf="isDownload">
                  <span class="indicator-progress" style="text-align: center;">
                    Please wait...
                    <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                  </span>
                </ng-container>
                <ng-container *ngIf="!isDownload">
                  <span class="indicator-label"> Export </span>
                </ng-container>
            </button>
          </div>
        </form>
      </div>
      <div class="col-lg-12">
        <div class="table-responsive mt-4 px-0" *ngIf="emailTemplatesData?.length && !initialLoader">
          <table class="table user-management" mat-table [dataSource]="emailTemplatesData">
            <ng-container matColumnDef="body">
              <th mat-header-cell *matHeaderCellDef style="width:50%">Body</th>
              <td mat-cell *matCellDef="let element">
                <div class="d-flex align-items-center flex-wrap">
                  <div class="fw-semibold">
                    <p class="text-info-dark fw-semibold mb-2">{{element.body}}</p>
                  </div>
                </div>
              </td>
            </ng-container>
            <ng-container matColumnDef="check">
              <th mat-header-cell *matHeaderCellDef disableClear></th>
              <td mat-cell *matCellDef="let element; let i=index">
                <input (change)="select($event, element)" [(ngModel)]="element.multiSelect"
                  class="form-check-input cursor-pointer mb-1" type="checkbox" name="multiSelect" id="issuccess" />
              </td>
            </ng-container>
            <ng-container matColumnDef="title">
              <th mat-header-cell *matHeaderCellDef>Title</th>
              <td mat-cell *matCellDef="let element">
                <span class="word-break">{{element.title}}</span>
              </td>
            </ng-container>
            <ng-container matColumnDef="type">
              <th mat-header-cell *matHeaderCellDef>Type</th>
              <td mat-cell *matCellDef="let element">
                <span class="word-break">{{element.type}}</span>
              </td>
            </ng-container>
            <ng-container matColumnDef="enabled">
              <th mat-header-cell *matHeaderCellDef>Enabled</th>
              <td mat-cell *matCellDef="let element">
                <p class="text-grey-3  my-0" >
                  <img *ngIf="element.enabled" src="./assets/images/enabled.svg">
                  <img *ngIf="!element.enabled" src="./assets/images/disabled.svg">
                </p>
              </td>
            </ng-container>
            <ng-container matColumnDef="action">
              <th mat-header-cell *matHeaderCellDef>Actions</th>
              <td mat-cell *matCellDef="let element">
                <div class="text-start">
                  <img src="./assets/images/more-vertical.svg" #ddTrigger="matMenuTrigger" [matMenuTriggerFor]="dd"
                    class="cursor-pointer">
                  <mat-menu #dd="matMenu" [overlapTrigger]="false">
                    <div class="dropdown">
                      <div class="action-frame">
                        <!-- <div class="mx-3 cursor-pointer" (click)="openDialog(element.id)">Edit</div> -->
                        <div class="mx-3 cursor-pointer" (click)="onEdit(element.id)">Edit</div>
                        <hr class="hr-line text-gray-400" />
                        <div class="mx-3 cursor-pointer" (click)="openConfirmationModal(element)">Remove</div>
                      </div>
                    </div>
                  </mat-menu>
                </div>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          <!-- <div *ngIf="!initialLoader">
              <mat-paginator (page)="onPageChange($event)" [length]='totalElements' [pageIndex]="pageInd"
                [pageSize]="queryParams.limit" [pageSizeOptions]="[5, 10, 20, 50, 100]" aria-label="Select page">
              </mat-paginator>
          </div> -->
        </div>
        <div class="center d-flex flex-column align-items-center mt-5"
          *ngIf="!emailTemplatesData?.length && !initialLoader">
          No records found !
        </div>
        <div class="center h-100 mt-5" *ngIf="initialLoader">
          <app-page-loader class="v-center"></app-page-loader>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirmation -->
<app-delete-confirmation-modal #deleteModal [content]="
'Be careful, this process can not be undone. Are you sure you want to delete this Email Template'
" [isLoading]="isDelete" (hidden)="deleteModal.hide()" (yes)="deleteEmailTemplate()"
  (no)="deleteModal.hide()"></app-delete-confirmation-modal>
