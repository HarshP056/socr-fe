<div class="main-content bg-white w-100">
  <div class="row mx-0 pt-3 pt-lg-4">
    <div class="p-4 pt-0">
      <div class="col-sm-12 mb-3">
        <div class="d-flex align-items-center justify-content-between">
          <a routerLink="/system-admin/configurations" class="text-decoration-none d-flex align-items-center px-0">
            <h5 class="fw-semibold"><img src="./assets/images/arrow-left.svg" class="me-1" alt="arrow left"> Email Classification</h5>
          </a>
          <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 text-nowrap pb-3 pt-0 pt-lg-3">
            <a routerLink="create" class="btn btn-info shadow"><img src="./assets/images/plus.svg"
                class="me-1" alt="add"> New Email Classifier</a>
          </div>
        </div>

        <div class="alert alert-warning d-flex align-items-start rounded-0 border-0 p-2 mb-3" role="alert">
          <img src="./assets/images/bulb.svg" class="me-2" alt="bilb">
          <div class="text-grey-4">
            Configure how incoming emails are automatically categorized.
          </div>
        </div>
      </div>

      <div class="col-lg-12 px-0 mb-3">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 bg-light-2 border border-dashed rounded-3 px-3">
            <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 pt-3 pb-0 pb-lg-3">
              <div>
                <div class="d-flex align-items-center">
                  <div class="position-relative search-form">
                    <img src="./assets/images/search.svg" class="ms-2 position-absolute" alt="search icon">
                    <input type="search" class="form-control py-2" placeholder="Search by Name or Description" [(ngModel)]="queryParams.query" style="width: 250px;">
                  </div>

                  <div class="d-flex align-items-center gap-2 ms-2">
                    <div>
                      <button matRipple class="btn btn-info shadow" [disabled]="isLoading" (click)="search()">
                        <ng-container *ngIf="isLoading">
                          <span clas="indicator-progress" [style.display]="'block'">
                            Searching...{{ " " }}
                            <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                          </span>
                        </ng-container>
                        <span *ngIf="!isLoading">Search</span>
                      </button>
                    </div>
                    <div>
                      <button class="btn btn-light text-info-dark fw-semibold shadow bg-white me-3" matRipple [disabled]="resettingLoader" (click)="reset()">
                        <ng-container *ngIf="resettingLoader">
                          <span clas="indicator-progress" [style.display]="'block'">
                            Resetting...{{ " " }}
                            <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                          </span>
                        </ng-container>
                        <span *ngIf="!resettingLoader">Reset</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
      </div>
      <ng-container *ngFor="let item of emailClassifiers">
        <div class="card mb-2">
          <div class="card-body">
            <div class="d-flex justify-content-between">
              <div>
                <h5 class="fw-bold mb-1">{{item?.name}}</h5>
                <p class="text-muted">{{item.desc}}</p>
              </div>
              <div class="d-flex align-items-center gap-2">
                <fa-icon [icon]="faTasks" class="mt-2 cursor-pointer" style="font-size: 20px;" [routerLink]="[item.id, 'workflows']" title="Email Classifier Workflow"></fa-icon>
                <fa-icon [icon]="faCopy" class="mt-1 cursor-pointer" style="font-size: 20px;" (click)="copyEmailClassification(item.id)" title="Copy"></fa-icon>
                <mat-slide-toggle [(ngModel)]="item.enabled" [checked]="item.enabled" (change)="updateEmailClassification($event, item)"></mat-slide-toggle>
                <span (click)="editEmailClassification(item.id)" class="text-info-dark cursor-pointer">
                  <fa-icon [icon]="faPencil" class="mt-1 cursor-pointer" style="font-size: 20px;" title="Edit"></fa-icon>
                </span>
                <span (click)="deleteEmailClassification(item.id)" class="text-danger cursor-pointer">
                  <fa-icon [icon]="faTrash" class="mt-1 cursor-pointer" style="font-size: 20px;" title="Delete"></fa-icon>
                </span>
              </div>
            </div>
            <div>
              <p class="fw-semibold mb-0">Confidence Threshold: {{item.confidence}}%</p>
              <mat-progress-bar mode="determinate" [value]="item.confidence" style="width: 70%;border-radius:4px;"></mat-progress-bar>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
