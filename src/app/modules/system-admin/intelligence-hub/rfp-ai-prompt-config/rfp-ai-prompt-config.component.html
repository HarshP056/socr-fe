<div class="container-fluid px-0">
  <div class="wrapper h-calc d-flex justify-content-center">
    <div class="wrapper-content d-flex justify-content-center w-100 flex-wrap">
      <div class="bg-white w-100">
        <div class="row mx-0 p-3 p-lg-4 pt-lg-3">
          <a routerLink="/system-admin/intelligence-hub" class="text-decoration-none d-flex align-items-center px-0">
            <h5 class="fw-semibold"><img src="./assets/images/arrow-left.svg" class="me-1" alt="arrow left"> RFP AI Prompt</h5>
          </a>
          <div class="col-lg-12 mb-2 px-0">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 bg-light-2 border
                        border-dashed rounded-3 px-3">
              &nbsp;
              <div
                class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 text-nowrap pb-3 pt-0 pt-lg-3">
                <div>
                  <button class="btn btn-info shadow" type="button" routerLink="/system-admin/intelligence-hub/ai-prompt/create"
                    aria-controls="offcanvasWithBothOptions"><img src="./assets/images/plus.svg" class="me-1" alt="add">
                    New RFP AI Prompt</button>
                </div>
              </div>
            </div>

            <div class="col-lg-12">
              <div class="table-responsive mt-4 px-0" *ngIf="rfpAIPrompt?.length && !initialLoader">
                <table class="table user-management" mat-table [dataSource]="rfpAIPrompt">
                  <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name </th>
                    <td mat-cell *matCellDef="let element">
                      <span class="text-info-dark fw-semibold">{{element.name}}</span>
                    </td>
                  </ng-container>

                  <ng-container matColumnDef="temperature">
                    <th mat-header-cell *matHeaderCellDef>Temperature</th>
                    <td mat-cell *matCellDef="let element">
                      <span class="fw-semibold text-truncate">{{element.temperature}}</span>
                    </td>
                  </ng-container>

                  <ng-container matColumnDef="maxTokens">
                    <th mat-header-cell *matHeaderCellDef>Max Tokens</th>
                    <td mat-cell *matCellDef="let element">
                      <span class="word-break">{{element.maxTokens}}</span>
                    </td>
                  </ng-container>

                  <ng-container matColumnDef="responseFormat">
                    <th mat-header-cell *matHeaderCellDef>Response Format</th>
                    <td mat-cell *matCellDef="let element">
                      <span class="fw-semibold text-truncate">{{element.responseFormat}}</span>
                    </td>
                  </ng-container>

                  <ng-container matColumnDef="role">
                    <th mat-header-cell *matHeaderCellDef>Role</th>
                    <td mat-cell *matCellDef="let element">
                      <span class="word-break">{{element.role}}</span>
                    </td>
                  </ng-container>

                  <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let element">
                      <div class="text-start">
                        <img src="./assets/images/more-vertical.svg" #ddTrigger="matMenuTrigger"
                          [matMenuTriggerFor]="dd" class="cursor-pointer">
                        <mat-menu #dd="matMenu" [overlapTrigger]="false">
                          <div class="dropdown">
                            <div class="action-frame">
                              <div class="mx-3 cursor-pointer" (click)="editRFPAIPrompt(element.id)">Edit</div>
                              <hr class="hr-line text-gray-400" />
                              <div class="mx-3 cursor-pointer" (click)="deleteRFPAIPrompt(element.id)">Remove</div>
                            </div>
                          </div>
                        </mat-menu>
                      </div>
                    </td>
                  </ng-container>

                  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
              </div>
            </div>
            <div class="center d-flex flex-column align-items-center mt-5" *ngIf="!rfpAIPrompt.length && !initialLoader">
              No records found !
            </div>
            <div class="center h-100" *ngIf="initialLoader">
              <app-page-loader class="v-center"></app-page-loader>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
