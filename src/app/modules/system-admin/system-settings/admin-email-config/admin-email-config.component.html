<div class="container-fluid px-0">
  <div class="wrapper h-calc-ocr d-flex justify-content-center">
      <div class="bg-white px-4 w-100">
        <div class="row mx-0 pt-3 pt-lg-4">
          <div class="p-4 pt-0">
            <div class="col-sm-12 ">
              <a routerLink="/system-admin/system-settings" class="text-decoration-none d-flex align-items-center px-0">
                <h5 class="fw-semibold"><img src="./assets/images/arrow-left.svg" class="me-1" alt="arrow left">
                  Admin Email Config
                </h5>
              </a>
            </div>
            <form #form="ngForm"
              class="d-flex align-items-center flex-wrap gap-2 bg-light-2 border border-dashed rounded-3 px-4 py-3">
              <div  class="w-100">
              <div class="row w-100">
                <div class="col-lg-12 mb-3">
                  <label for="username" class="form-label fw-semibold text-font-dark">Username</label>
                  <input [(ngModel)]="adminEmail.username" name="username" type="text" class="form-control" id="username"
                    placeholder="Enter Username" min="0" required>
                </div>
                <div class="col-lg-12 mb-3">
                  <label for="password" class="form-label fw-semibold text-font-dark">Password</label>
                  <div class="d-flex" style="position: relative;">
                    <input [(ngModel)]="adminEmail.password" name="password" type="password" class="form-control"
                      id="password" placeholder="Enter Password" [type]="showPassword ? 'text' : 'password'">
                    <span style="position: absolute;right: 0;top: 11px;" class="d-flex align-item-center">
                      <img [cdkCopyToClipboard]="adminEmail.password" class="px-2 cursor-pointer"
                      src="./assets/images/content-copy-outline.svg" />
                    <img *ngIf="!showPassword" img src="./assets/images/eye.svg" matTooltip="View" alt=""
                      class="me-3 cursor-pointer" (click)="showPassword = !showPassword">
                    <img *ngIf="showPassword" img src="./assets/images/eye-off-outline.svg" matTooltip="Hide" alt=""
                      class="me-3 cursor-pointer" (click)="showPassword = !showPassword">
                    </span>
                  </div>
                </div>
              </div>

              <button type="button" class="btn btn-danger px-4 py-2 my-3"
              (click)="deleteLicense()">
              <ng-container *ngIf="isDelete">
                <span clas="indicator-progress" [style.display]="'block'">
                  Please wait...{{ " " }}
                  <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                </span>
              </ng-container>
              <ng-container *ngIf="!isDelete">Delete</ng-container>
            </button>
              <button type="button" class="btn btn-info px-4 py-2 my-3 ms-2" [disabled]="isWait || form.invalid"
                (click)="submit()">
                <ng-container *ngIf="isWait">
                  <span clas="indicator-progress" [style.display]="'block'">
                    Please wait...{{ " " }}
                    <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                  </span>
                </ng-container>
                <ng-container *ngIf="!isWait && editMode">Update</ng-container>
                <ng-container *ngIf="!isWait && !editMode">Save</ng-container>
              </button>
              </div>
            </form>
          </div>
        </div>
    </div>
  </div>
</div>
