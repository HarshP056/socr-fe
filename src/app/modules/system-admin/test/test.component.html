<div class="tab-pane">
  <div class="row mx-0 p-3 p-lg-4">
    <div class="col-sm-12 mb-4">
      <h5 class="fw-semibold"> Test </h5>
      <div class="d-flex align-items-start gap-2 flex-wrap flex-md-nowrap">
        <div class="alert alert-warning d-flex align-items-start rounded-0 border-0 p-2 mb-4" role="alert">
          <img src="./assets/images/bulb.svg" class="me-2" alt="bilb">
          <div class="text-grey-4">
            Lorem ipsum dolor sit amet consectetur. Est blandit cursus tellus mi sagittis ac euismod
            dignissim. Cursus scelerisque iaculis arcu vitae in morbi pulvinar tempus cursus. In ultricies
            tortor fermentum malesuada quis. Vitae viverra.
          </div>
        </div>

      </div>
      <div class="d-flex align-items-center gap-3">
        <button class="common-btn" (click)="getSyncNow()">
          <span><img src="./assets/images/round-sync.svg"></span>
          Test Erp Sync Api</button>
        <button class="cancel-btn" (click)="onClear()">
          Clear</button>
      </div>
      <!-- <div class="d-grid mb-4 mb-xxl-2 " style="width:20px" (click)="getSyncNow()">
        <a class="btn btn-info bg-info py-3 border-light d-flex justify-content-center  text-nowrap"><img
            src="./assets/images/round-sync.svg" alt="" class="pe-2">Test Erp Sync Api</a>
      </div> -->
      <div class="row">
        <div class="center h-100" *ngIf="initialLoader">

          <app-page-loader class="v-center"></app-page-loader>
        </div>
        <div class="col-lg-12 mt-4" *ngIf="syncData">
          <span>Get : <span class="fw-semibold">{{url}}</span></span>
          <pre class="mt-3">{{syncData | xml}}</pre>
        </div>

      </div>
    </div>
  </div>
</div>
