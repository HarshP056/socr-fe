<div class="container-fluid px-0 h-100" style="overflow: hidden;">
  <div class="wrapper h-100 d-flex justify-content-center">
    <div class="wrapper-content d-flex justify-content-center w-100 flex-wrap h-100">
      <div class="bg-white w-100 h-100">      
        <div style="height: calc(100% - 5px) !important;">
          <div class="d-flex col-lg-12 h-100">
            <div class="col-lg-6 h-100" style="overflow-y: auto;">
              <div class="d-flex align-items-center px-3 py-2">
                <h5 style="cursor: pointer;margin-bottom: 0;" routerLink="/ocr-q" class="fw-semibold">
                  <img src="./assets/images/arrow-left.svg" class="me-1" alt="arrow left" (click)="onBack()" > Back
                </h5>
                <div class="d-flex align-items-center ps-5 mt-1" *ngIf="invoiceOCRData">
                  <img src="./assets/images/pending-stage.svg" class="me-1" alt="" *ngIf="invoiceOCRData.stage == 'New'" />
                  <img src="./assets/images/success-stage.svg" class="me-1" alt="" *ngIf="invoiceOCRData.stage != 'New'" />
                  <span>New</span>
                  <div style="width: 50px;border: 3px solid #50CD89;" class="ms-1" *ngIf="invoiceOCRData.stage != 'Recognizing'"></div>
                  <div style="width: 50px;border: 3px solid #FFA800;" class="ms-1" *ngIf="invoiceOCRData.stage == 'Recognizing'"></div>
                  <img src="./assets/images/pending-stage.svg" class="me-1" alt="" *ngIf="invoiceOCRData.stage == 'Recognizing'" />
                  <img src="./assets/images/success-stage.svg" class="me-1" alt="" *ngIf="invoiceOCRData.stage != 'Recognizing'" />
                  <span>Recognized</span>
                  <div style="width: 50px;border: 3px solid #50CD89;" class="ms-1" *ngIf="invoiceOCRData.stage != 'Verification'"></div>
                  <div style="width: 50px;border: 3px solid #FFA800;" class="ms-1" *ngIf="invoiceOCRData.stage == 'Verification'"></div>
                  <img src="./assets/images/pending-stage.svg" class="me-1" alt="" *ngIf="invoiceOCRData.stage == 'Verification'" />
                  <img src="./assets/images/success-stage.svg" class="me-1" alt="" *ngIf="invoiceOCRData.stage != 'Verification'" />
                  <span>Verified</span> 
                  <div style="width: 50px;border: 3px solid #50CD89;" class="ms-1" *ngIf="invoiceOCRData.stage != 'Processed'"></div>
                  <div style="width: 50px;border: 3px solid #FFA800;" class="ms-1" *ngIf="invoiceOCRData.stage == 'Processed'"></div>                 
                  <img src="./assets/images/pending-stage.svg" class="me-1" alt="" *ngIf="invoiceOCRData.stage == 'Processed'" />
                  <img src="./assets/images/success-stage.svg" class="me-1" alt="" *ngIf="invoiceOCRData.stage != 'Processed'" />
                  <span>Processed</span>
                </div>
                <div class="d-flex align-items-center ps-5 mt-1" *ngIf="invoiceOCRData?.stage === 'Processed' || invoiceOCRData?.stage === 'Verification'">
                  <img src="./assets/images/eye.svg" alt="" (click)="getDoc(invoiceOCRData)" matTooltip="Download Invoice"
                    matTooltipPosition="above" class="me-2 cursor-pointer"  />
                  <img src="./assets/images/download.svg" alt="" (click)="downloadXML(invoiceOCRData.taxId)"
                    matTooltip="Download Invoice Data" matTooltipPosition="above" class="me-2 cursor-pointer" />
                </div>
              </div>
              <div class="pdf-document-viewer" [hidden]="!displayImg">
                <div #canContainer class="canContainer" style="width: 100%;; overflow-y: auto;" id="canCont1">
                  <div class="mb-2 ms-2" *ngFor="let elem of canvasList let i= index;" [hidden]="i != canvasPageInd">
                    <img *ngIf="elem.imgUrl" [src]="elem.imgUrl" alt="Image" style="max-width: 100%; display: block;">
                  </div>
                </div>
                <mat-paginator [length]="canvasList.length"  [pageIndex]="canvasPageInd" [pageSize]="1" *ngIf="canvasList && canvasList.length > 0"
                [pageIndex]="canvasPage - 1" [pageSizeOptions]="[1]" (page)="onCanvasPaginateChange($event)">
                </mat-paginator>
                <!-- <div #canContainer class="canContainer" style="width: 100%;; overflow-y: auto;" id="canCont1">                
                  <div class="mb-5 ms-2" *ngFor="let elem of canvasList">
                    <canvas class="canvas" (click)="$event.stopPropagation();" [id]="elem?.id"></canvas>
                  </div>                
                </div> -->
              </div>
              <div class="center pdf-document-viewer" *ngIf="!displayImg">
                <app-page-loader class="d-flex align-items-center justify-content-center h-100" [content]="'Loading Image...'"></app-page-loader>
              </div>
            </div>
            <div class="col-lg-6 h-100 ps-1" style="border-left: 1px solid #e4e7ec; overflow-y: auto;">
              <div>
                <ul class="nav nav-tab">
                  <li class="nav-item me-2">
                    <a class="nav-link" [ngClass]="{activeTab:selectedTab === 'pre-built Invoice'}"
                      (click)="setActiveTab('pre-built Invoice')">
                      <span>
                        Invoice
                      </span>
                    </a>
                  </li>
                  <li class="nav-item me-2">
                    <a class="nav-link" [ngClass]="{activeTab:selectedTab === 'Line Items'}"
                      (click)="setActiveTab('Line Items')">
                      <span>
                        Content
                      </span>
                    </a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" [ngClass]="{activeTab:selectedTab === 'dynamic fields'}"
                      (click)="setActiveTab('dynamic fields')">
                      <span>
                        Key-value pairs
                      </span>
                    </a>
                  </li>
                </ul>
              </div>
              <div class="h-c-30" *ngIf="selectedTab == 'pre-built Invoice'">
                <div class="px-2 py-3 mb-3 doc-type-item">DocType: <span
                    class="fw-bold ps-1">{{fixedfields?.docType}}</span></div>
                <div *ngFor="let item of fieldsArr" class="px-2 fix-fields mb-2 pb-2">                  
                  <div class="d-flex align-items-center" *ngIf="item.name =='PurchaseOrder'">
                    <label class="col-3 fw-bold text-dark">PO Number</label>
                    <input [(ngModel)]="item.content" name="PurchaseOrder" class="col-9 ms-1 purchaseOrder" />
                  </div>
                  <div *ngIf="item.type == 'Invoice'">
                    <label class="mb-2 fw-bold text-dark">Invoice</label>
                    <div class="d-flex align-items-center mb-2 px-2">
                      <div *ngFor="let inv of item.data">
                        <div class="col-6 d-flex-column" *ngIf="inv.name == 'InvoiceId'">
                          <label class="fw-bold">Invoice Number</label>
                          <input [(ngModel)]="inv.content" name="{{inv.name}}" />
                        </div>                        
                      </div>
                      <div *ngFor="let inv of item.data">
                        <div class="col-6 d-flex flex-column" *ngIf="inv.name == 'InvoiceDate'">
                          <label class="fw-bold">Invoice Date</label>
                          <input [(ngModel)]="inv.content" name="{{inv.name}}" />
                        </div>                        
                      </div>
                    </div>
                    <div class="d-flex align-items-center mb-2 px-2">
                      <div *ngFor="let inv of item.data">
                        <div class="d-flex flex-column" *ngIf="inv.name == 'SubTotal'">
                          <label class="fw-bold">Sub Total</label>
                          <input [(ngModel)]="inv.content" name="{{inv.name}}" />
                        </div>
                      </div>
                      <div *ngFor="let inv of item.data">
                        <div class="d-flex flex-column" *ngIf="inv.name == 'TotalTax'">
                          <label class="fw-bold">Total Tax</label>
                          <input [(ngModel)]="inv.content" name="{{inv.name}}" />
                        </div>
                      </div>
                      <div *ngFor="let inv of item.data">
                        <div class="d-flex flex-column" *ngIf="inv.name == 'InvoiceTotal'">
                          <label class="fw-bold">Total</label>
                          <input [(ngModel)]="inv.content" name="{{inv.name}}" />
                        </div>
                      </div>
                    </div>
                  </div>
                  <div *ngIf="item.type == 'Vendor'">
                    <label class="mb-2 fw-bold text-dark">Vendor</label>
                    <div class="d-flex align-items-center px-2">
                      <div class="col-6 d-flex flex-column">
                        <label class="fw-bold">Vendor Id</label>
                        <input [(ngModel)]="vendorId" name="vendorId" />
                      </div>
                      <div [ngClass]="{'w-50': vendor.name == 'VendorName'}" *ngFor="let vendor of item.data">
                        <div *ngIf="vendor.name == 'VendorName'">
                          <div class="d-flex flex-column">
                            <label class="fw-bold">Name</label>
                            <input [(ngModel)]="vendor.content" name="{{vendor.name}}" class="w-100" />
                          </div>
                        </div>
                      </div>
                    </div>                    
                    <div class="d-flex align-items-center px-2" *ngFor="let vendor of item.data">
                      <div class="col-12 mt-3" *ngIf="vendor.name == 'VendorAddressRecipient'">
                        <label class="col-3">Address Recipient</label>
                        <input [(ngModel)]="vendor.content" name="{{vendor.name}}" class="col-9" />
                      </div>
                    </div>
                    <div class="d-flex align-items-center px-2" *ngFor="let vendor of item.data">
                      <div class="col-12 mt-3" *ngIf="vendor.name == 'VendorAddress'">
                        <label class="col-2">Address</label>
                        <input [(ngModel)]="vendor.content" name="{{vendor.name}}" class="col-10" />
                      </div>
                    </div>
                  </div>                  
                  <div *ngIf="item.type != 'Invoice' && item.type != 'Vendor' && item.name != 'PurchaseOrder'">
                    <div class="d-flex align-items-center">
                      <label class="col-3 fw-bold text-dark">{{item.name}}</label>
                      <input [(ngModel)]="item.content" name="{{item.name}}" class="col-9 ms-1"
                       [ngClass]="{'max-content' : item.name == 'CustomerName' || item.name == 'BillingAddressRecipient' || item.name == 'ShippingAddressRecipient' || item.name == 'PaymentTerm'}" />
                    </div>
                  </div>
                </div>
              </div>
              <div class="px-2 py-3 h-c-30 abc" *ngIf="selectedTab === 'Line Items'">
                <table class="table table-bordered w-100 mdiLineItem">
                  <thead>
                    <tr>
                      <th *ngFor="let head of lineHeaders">{{head}}</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let data of lineArr; let i= index;">
                      <td *ngFor="let item of data.valueObjectM">
                        <input [(ngModel)]="item.content" name="{{item.name}}" class="" />
                      </td>
                    </tr>
                  </tbody>
                </table>
                <!-- <mat-paginator [length]="totalLength" [pageIndex]="pageInd" [pageSize]="1" [pageIndex]="page - 1"
                  [pageSizeOptions]="[1]" (page)="onPaginateChange($event)">
                </mat-paginator> -->
              </div>
              <div class="px-2 py-3 h-c-30" *ngIf="selectedTab === 'dynamic fields'">
                <div *ngFor="let field of dynamicfields" class="mx-2 fix-fields mb-3 pb-2">
                  <div class="d-flex align-items-center gap-4">
                    <label class="text-muted" style="min-width: fit-content;">{{field.key.content}}</label>
                    <input class="form-control" [(ngModel)]="field.value.content" name="{{field.key.content}}" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
