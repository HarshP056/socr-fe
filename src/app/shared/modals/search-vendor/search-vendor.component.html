<div class="w-12">
  <div class="modal-body p-4">
    <div class="col-lg-12 mb-2 px-0">
      <div
        class="d-flex align-items-center justify-content-between flex-wrap gap-2 bg-light-2 border border-dashed rounded-3 px-3">
        <div class="d-flex align-items-center flex-wrap text-grey-3 fw-medium gap-3 pt-3 pb-0 pb-lg-3">
          <div class="position-relative search-form">
            <img src="./assets/images/search.svg" class="ms-2 position-absolute" alt="search icon">
            <input type="search" class="form-control w-sm-auto py-2" placeholder="Search by Vendor Name" [(ngModel)]="searchQueryParams.name">
          </div>
          <div class="position-relative search-form">
            <img src="./assets/images/search.svg" class="ms-2 position-absolute" alt="search icon">
            <input type="search" class="form-control w-sm-auto py-2" placeholder="Search by Supplier Id" [(ngModel)]="searchQueryParams.supplierId">
          </div>
          <div class="position-relative search-form">
            <img src="./assets/images/search.svg" class="ms-2 position-absolute" alt="search icon">
            <input type="search" class="form-control w-sm-auto py-2" placeholder="Search by GSTIN" [(ngModel)]="searchQueryParams.gstNo">
          </div>
          <div class="card flex justify-content-center" style="border: none;">
            <p-dropdown name="system" [options]="systems" optionValue="systemId" optionLabel="systemId" [showClear]="true" placeholder="Select System" [(ngModel)]="searchQueryParams.logicalSystem"></p-dropdown>
          </div>
          <div class="d-flex align-items-center gap-2 ms-2">
            <div>
              <button matRipple class="btn btn-info shadow" [disabled]="isLoading" (click)="search()">
                <ng-container *ngIf="isLoading">
                  <span clas="indicator-progress" [style.display]="'block'">
                    Searching...{{ " " }}
                    <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                  </span>
                </ng-container>
                <span *ngIf="!isLoading">Search</span>
              </button>
            </div>
            <div>
              <button class="btn btn-light text-info-dark fw-semibold shadow bg-white me-3" matRipple [disabled]="resettingLoader" (click)="reset()">
                <ng-container *ngIf="resettingLoader">
                  <span clas="indicator-progress" [style.display]="'block'">
                    Resetting...{{ " " }}
                    <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                  </span>
                </ng-container>
                <span *ngIf="!resettingLoader">Reset</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-12">
        <div class="table-responsive mt-4 px-0" *ngIf="vendors?.length && !initialLoader">
          <table class="table user-management" mat-table [dataSource]="vendors">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Vendor </th>
              <td mat-cell *matCellDef="let element" class="cursor-pointer" (click)="onSelectVendor(element)">
                <div class="d-flex align-items-center flex-wrap">
                  <div class="icon-box icon-box-table p-3 icon-box-warning rounded-3 position-relative">
                    <span class="text-uppercase fw-bold fs-6">{{element.name.trim().substring(0, 1)}}</span>
                  </div>
                  <div class="ms-xxl-3 ms-3">
                    <p class="text-info-dark fw-semibold mb-0">{{element.name}}</p>
                    <p class="text-grey-4 mb-0">{{element.primaryEmail}}</p>
                  </div>
                </div>
              </td>
            </ng-container>

            <ng-container matColumnDef="supplierId">
                <th mat-header-cell *matHeaderCellDef>Supplier Id</th>
                <td mat-cell *matCellDef="let element">
                  <span class="fw-semibold">{{element.supplierId}}</span>
                </td>
              </ng-container>

            <ng-container matColumnDef="phone">
              <th mat-header-cell *matHeaderCellDef>Phone No</th>
              <td mat-cell *matCellDef="let element">
                <span class="word-break">{{element.phone}}</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="logicalSystem">
              <th mat-header-cell *matHeaderCellDef>System</th>
              <td mat-cell *matCellDef="let element">
                <span class="word-break">{{element.logicalSystem}}</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="gst">
              <th mat-header-cell *matHeaderCellDef>GSTIN</th>
              <td mat-cell *matCellDef="let element">
                <span class="word-break">{{element.gstNo}}</span>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
          <div *ngIf="!initialLoader">
            <mat-paginator (page)="onPageChange($event)" [length]='totlaElements' [pageIndex]="pageInd"
              [pageSize]="searchQueryParams.limit" [pageSizeOptions]="[5, 10, 20, 50, 100]" aria-label="Select page">
            </mat-paginator>
          </div>
        </div>
        <div class="center d-flex flex-column align-items-center mt-5" *ngIf="!vendors?.length && !initialLoader">
          No records found !
        </div>
        <div class="center h-100 mt-5" *ngIf="initialLoader">
          <app-page-loader class="v-center"></app-page-loader>
        </div>
      </div>
    </div>

  </div>
  <div class="modal-footer">
    <div class="d-flex flex-grow-1 justify-content-end">
      <div class="d-flex">
        <button class="cancel-btn me-3" (click)="close()">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
