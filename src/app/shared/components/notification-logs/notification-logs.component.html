<div class="d-flex pt-0 pe-0 border-bottom align-items-start justify-content-between">
  <div class="text-grey-3 fw-medium d-flex align-items-center gap-2 py-3 ps-3">
    Notification Logs <br>
  </div>

  <button type="button" class="btn btn-cls" mat-dialog-close aria-label="Close"><img src="./assets/images/x.svg"
      alt=""></button>
</div>
<div class="col-lg-12">
  <div class="table-responsive px-0">
    <ng-container *ngIf="notificationLogs?.length && !initialLoader">
      <table mat-table matSort class="table user-management" [dataSource]="notificationLogs"
        (matSortChange)="sortChange($event)" matSortDirection="desc" matSortActive="createdDate">
        <ng-container matColumnDef="emailFrom">
          <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
            Email From
          </th>
          <td mat-cell *matCellDef="let element">
            <p class="text-info-dark my-0">{{element.emailFrom}}</p>
          </td>
        </ng-container>
        <ng-container matColumnDef="emailTo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
            Email To
          </th>
          <td mat-cell *matCellDef="let element">
            <span>{{element.emailTo}}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="emailSend">
          <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
            Email Send
          </th>
          <td mat-cell *matCellDef="let element">
            <span>{{element.emailSend}}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="notificationType">
          <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
            Notification Type
          </th>
          <td mat-cell *matCellDef="let element">
            <span>{{element.notificationType}}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="createdDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
            Created Date
          </th>
          <td mat-cell *matCellDef="let element">

            <p class="text-grey my-0">{{element.createdDate | date : "medium"}}</p>
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header disableClear>
            Status
          </th>
          <td mat-cell *matCellDef="let element">
            <p class="text-grey-3 my-0">{{element.status}}</p>
          </td>
        </ng-container>
        <!-- ================================================================ -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class=""></tr>
      </table>
      <div *ngIf="!initialLoader">
        <mat-paginator showFirstLastButtons [length]="totalElements" [pageSize]="queryParams.limit"
          (page)="onPaginateChange($event)" [pageIndex]="pageInd- 1" [pageSizeOptions]="[5,10,25,100]">
        </mat-paginator>
      </div>
    </ng-container>
  </div>


</div>
<div class="center d-flex flex-column align-items-center mt-5" *ngIf="!notificationLogs?.length && !initialLoader">
  No records found !
</div>
<div class="center h-100" *ngIf="initialLoader">
  <app-page-loader class="v-center"></app-page-loader>
</div>
